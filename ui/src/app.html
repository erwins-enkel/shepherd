<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/v2/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shepherd" />
    <meta name="theme-color" content="#0a0d0c" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to return non-zero
         values; without it iOS letterboxes content and the insets stay 0. Paired with
         apple-mobile-web-app-status-bar-style=black-translucent for a full-bleed dark shell. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Standards-track opt-in (env(preferred-text-scale), Chrome Canary 2026; not
         yet in WebKit). Harmless where unsupported; the iOS path below carries us
         until Safari ships it. -->
    <meta name="text-scale" content="scale" />
    <title>Shepherd</title>
    <!-- Resolve the theme before first paint so there's no flash of wrong theme.
         Mirrors the logic in src/lib/theme.svelte.ts. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("shepherd:theme") || "system";
          var dark =
            pref === "dark" ||
            (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          // Hexes mirror app.css --color-bg per theme (runtime setter in
          // theme.svelte.ts uses the same values).
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#0a0d0c" : "#e7ebe9");
          if (localStorage.getItem("shepherd:contrast") === "high")
            document.documentElement.dataset.contrast = "high";
          // Motion preference before first paint too: app.css keys the
          // decorative-motion kill switch on [data-motion], so setting it only at
          // hydration would let a suppressed animation flash first.
          var motion = localStorage.getItem("shepherd:motion");
          document.documentElement.dataset.motion =
            motion === "full" || motion === "reduced" ? motion : "system";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.dataset.motion = "system";
        }
      })();
    </script>
    <!-- iOS Dynamic Type bridge. The whole type scale is `calc(<px> * var(--ui-scale))`
         in app.css, and the canvas-rendered xterm terminal multiplies the same ratio in
         on the JS side (ui-scale.svelte.ts observes this element's inline-style writes);
         this resolves --ui-scale to the user's iOS system Text Size so the
         UI honors that setting (the slider in Control Center / Settings → Display).
         WebKit only exposes the preference through the `-apple-system-body` font
         keyword — never a number — so we render a hidden probe with that font and read
         its computed size, dividing by 17 (the iOS default "body" px) to get a ratio:
         1.0 at the default slider (design preserved exactly), >1 / <1 as it moves.
         Guarded to iOS Safari: `-webkit-touch-callout: default` is supported there but
         NOT on macOS Safari (which also resolves -apple-system-body, smaller than 17,
         and would otherwise shrink the desktop UI). Runs pre-paint to avoid a resize
         flash; a ResizeObserver tracks live slider changes. --ui-scale defaults to 1
         in app.css, so non-iOS and any failure here leave the px scale untouched. -->
    <script>
      (function () {
        try {
          if (!(
            window.CSS &&
            CSS.supports &&
            CSS.supports("font: -apple-system-body") &&
            CSS.supports("-webkit-touch-callout: default")
          ))
            return;
          var probe = document.createElement("div");
          probe.setAttribute("aria-hidden", "true");
          probe.style.cssText =
            "position:absolute;top:-9999px;left:-9999px;visibility:hidden;font:-apple-system-body;";
          probe.textContent = "M";
          document.documentElement.appendChild(probe);
          var apply = function () {
            var px = parseFloat(getComputedStyle(probe).fontSize);
            if (px > 0) {
              // Cap at 1.5. Only the type tokens scale — spacing and fixed chrome
              // (e.g. the 44px action-bar / 28px icon-button hit targets) stay put,
              // so the accessibility end of Dynamic Type (~3x) would overflow them.
              // 1.5 honors a meaningfully larger choice while the dense bars hold.
              var ratio = Math.min(px / 17, 1.5);
              document.documentElement.style.setProperty("--ui-scale", String(ratio));
            }
          };
          apply();
          if (window.ResizeObserver) new ResizeObserver(apply).observe(probe);
        } catch (e) {}
      })();
    </script>
    <!-- Boot shell + boot-failure recovery (slow-link PWA, see src/lib/client-error.ts).
         The shell paints before any bundle lands, so a phone on a slow link sees progress
         instead of a blank page; +layout.svelte removes it once something real renders.
         If the kit-generated boot import() rejects (a chunk never arrived), reload with the
         same bounded backoff and sessionStorage key as client-error.ts — this runs before any
         bundle, so it cannot import that module; src/app-html.test.ts keeps both in sync.
         Hashed chunks are cached `immutable`, so every retry keeps what already landed.
         Colors are literals: app.css is not loaded yet (same deviation as src/error.html). -->
    <style>
      /* Beneath in-flow content (z-index -1): if SvelteKit paints its own bare fallback
         instead of the app, that text stays visible rather than under a spinner. */
      #boot-shell {
        position: fixed;
        inset: 0;
        z-index: -1;
        display: grid;
        place-items: center;
        background: #0a0d0c;
      }
      [data-theme="light"] #boot-shell {
        background: #e7ebe9;
      }
      #boot-shell .spin {
        width: 28px;
        height: 28px;
        border: 2px solid #1b2422;
        border-top-color: #e8a13a;
        border-radius: 50%;
        animation: boot-spin 0.9s linear infinite;
      }
      [data-theme="light"] #boot-shell .spin {
        border-color: #d2dad6;
        border-top-color: #a8680a;
      }
      #boot-shell button {
        display: none;
        width: 44px;
        height: 44px;
        font-size: 22px;
        line-height: 1;
        background: transparent;
        color: #e8a13a;
        border: 1px solid #1b2422;
        border-radius: 2px;
        cursor: pointer;
      }
      [data-theme="light"] #boot-shell button {
        color: #a8680a;
        border-color: #d2dad6;
      }
      #boot-shell[data-failed] .spin {
        display: none;
      }
      #boot-shell[data-failed] button {
        display: block;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-shell .spin {
          animation-duration: 2.4s;
        }
      }
    </style>
    <script>
      (function () {
        var KEY = "shepherd:chunk-reloads";
        var DELAYS_MS = [2000, 4000, 8000, 16000, 30000];
        var CHUNK = /dynamically imported module|importing a module script failed/i;
        window.addEventListener("unhandledrejection", function (e) {
          var shell = document.getElementById("boot-shell");
          var reason = e.reason && (e.reason.message || String(e.reason));
          if (!shell || !CHUNK.test(reason || "")) return;
          var delay = null;
          try {
            var done = Number(sessionStorage.getItem(KEY)) || 0;
            if (done < DELAYS_MS.length) {
              sessionStorage.setItem(KEY, String(done + 1));
              delay = DELAYS_MS[done];
            }
          } catch (err) {}
          if (delay === null) {
            // Budget spent (or storage blocked): stop and offer a manual retry.
            shell.setAttribute("data-failed", "");
            return;
          }
          setTimeout(function () {
            location.reload();
          }, delay);
        });
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <!-- aria-label: inline EN/DE (no catalog before the bundle loads), same hand-synced
         precedent as src/error.html. -->
    <div id="boot-shell" aria-busy="true">
      <div class="spin"></div>
      <button type="button" onclick="location.reload()">&#x21bb;</button>
    </div>
    <script>
      (function () {
        var b = document.querySelector("#boot-shell button");
        var lang = "";
        try {
          lang = localStorage.getItem("PARAGLIDE_LOCALE") || "";
        } catch (e) {}
        lang = lang || navigator.language || "en";
        b.setAttribute("aria-label", /^de\b/i.test(lang) ? "Erneut versuchen" : "Retry");
      })();
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
