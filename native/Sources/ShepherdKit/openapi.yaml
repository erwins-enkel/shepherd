          items:
            type: string
        latestReview:
          $ref: "#/components/schemas/PrReview"
        issueUrl:
          type: string
        deployConfigured:
          type: boolean
    SessionGitEvent:
      type: object
      additionalProperties: true
      required:
        - id
        - git
      properties:
        id:
          type: string
        git:
          $ref: "#/components/schemas/GitState"
    PrReviewerOptions:
      type: object
      additionalProperties: true
      required:
        - logins
        - unavailable
        - prNumber
        - repoSlug
        - isFork
        - requestedReviewers
        - authorLogin
        - defaultReviewer
        - isDraft
      properties:
        logins:
          type: array
          items:
            type: string
        unavailable:
          type: boolean
          description: The host refused the list, or the forge has none.
        prNumber:
          type: integer
        repoSlug:
          type:
            - string
            - "null"
        isFork:
          type: boolean
        requestedReviewers:
          type: array
          items:
            type: string
        authorLogin:
          type:
            - string
            - "null"
        defaultReviewer:
          type:
            - string
            - "null"
        isDraft:
          type: boolean
    ReviewRequestAck:
      type: object
      additionalProperties: true
      required:
        - ok
      properties:
        ok:
          type: boolean
        refreshPending:
          type: boolean
          description: Requested, but the server's follow-up status read failed; re-read GET /git.
    ReviewRequestBody:
      type: object
      additionalProperties: false
      required:
        - prNumber
        - reviewer
      properties:
        prNumber:
          type: integer
          minimum: 1
        reviewer:
          type: string
          pattern: ^[A-Za-z\d](?:[A-Za-z\d]|-(?=[A-Za-z\d])){0,38}$
    OpenPrBody:
      type: object
      additionalProperties: false
      description: Both optional; the server falls back to the session's name and prompt.
      properties:
        title:
          type: string
        body:
          type: string
    MergeMethod:
      type: string
      enum:
        - merge
        - squash
        - rebase
    MergePrBody:
      type: object
      additionalProperties: false
      description: Both optional; the server falls back to the forge default and deleteBranch true.
      properties:
        method:
          $ref: "#/components/schemas/MergeMethod"
        deleteBranch:
          type: boolean
    WorkingBlockedMap:
      type: object
      additionalProperties:
        type: boolean
      description: GET /api/working-blocked. Session id -> true while a session the poller called blocked is in fact still producing output. The web UI folds this into the status it shows (ui/src/lib/display-status.ts).
    HoldCode:
      anyOf:
        - $ref: "#/components/schemas/HoldCodeKnown"
        - type: string
    HoldCodeKnown:
      type: string
      enum:
        - halted-error
        - halted-usage
        - autopilot-paused
        - blocked-menu
        - blocked-yes-no
        - blocked-awaiting-input
        - blocked-stall
        - blocked-generic
        - quota-rework
        - quota-review
        - quota-error
        - quota-plan
        - plan-rework
        - plan-question
        - critic-rework
        - ci-red
        - pr-conflict
        - awaiting-merge
        - train-error
        - stalled
        - recap-attention
        - merging
        - merge-rebasing
        - ready-merge
        - manual-steps
    HoldParams:
      type: object
      additionalProperties: true
      description: Every member is optional; which ones are set depends on the HoldCode.
      properties:
        round:
          type: integer
        cap:
          type: integer
        findings:
          type: integer
        resetAt:
          type: integer
        pr:
          type: integer
        rebaseCount:
          type: integer
        question:
          type: string
        steps:
          type: integer
    HoldReason:
      type: object
      additionalProperties: true
      required:
        - code
      properties:
        code:
          $ref: "#/components/schemas/HoldCode"
        params:
          $ref: "#/components/schemas/HoldParams"
    HoldMap:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/HoldReason"
      description: GET /api/holds. Session id -> why that session is parked. Absent means not holding.
    BlockMap:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/BlockReason"
      description: GET /api/blocks. Session id -> what the agent is waiting on. Absent means not blocked.
    UsageProjection:
      type: object
      additionalProperties: true
      required:
        - window
        - projectedPct
        - resetAt
        - burnRatePerHour
      properties:
        window:
          type: string
          enum:
            - 5H
            - WK
          description: The rate-limit window this projection is for.
        projectedPct:
          type: number
          description: Not clamped; may exceed 100.
        resetAt:
          type: integer
        burnRatePerHour:
          type: number
    UsageLimitsResponse:
      type: object
      additionalProperties: true
      required:
        - limits
        - projections
      description: GET /api/usage/limits wraps the limits; the usage:limits event carries UsageLimits bare.
      properties:
        limits:
          $ref: "#/components/schemas/UsageLimits"
        projections:
          type: array
          items:
            $ref: "#/components/schemas/UsageProjection"
    HeldChangedEvent:
      type: object
      additionalProperties: true
      required:
        - count
      properties:
        count:
          type: integer
          description: How many tasks are held behind the usage gate right now.
    SessionWorkingBlockedEvent:
      type: object
      additionalProperties: true
      required:
        - id
        - working
      properties:
        id:
          type: string
        working:
          type: boolean
    ResumeRequest:
      type: object
      additionalProperties: false
      description: POST /api/sessions/{id}/resume. `force` tears a stale husk down and respawns instead of adopting a live pane (src/service.ts resumeInner). The web's card menu always forces.
      properties:
        force:
          type: boolean
    RenameRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          description: Free text; the server slugifies it (slugifyManual) before storing. Must not be blank after trimming.
    RenameResult:
      type: object
      additionalProperties: true
      required:
        - session
        - branchRenamed
      properties:
        session:
          $ref: "#/components/schemas/Session"
        branchRenamed:
          type: boolean
          description: False when an open PR pinned the git branch, so only the display name moved (src/server.ts resolveRenameBranch).
    AmendmentRequest:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          description: The operator's scope amendment. Trimmed, non-empty, at most 2000 characters (AMENDMENT_MAX_CHARS, src/task-amendments.ts).
        steer:
          type: boolean
          description: Also deliver the text to the live agent. The amendment is recorded either way; `steered` in the response reports whether delivery landed.
    TaskAmendment:
      type: object
      additionalProperties: true
      required:
        - id
        - sessionId
        - text
        - createdAt
        - retractedAt
      description: Copied from TaskAmendment in src/task-amendments.ts.
      properties:
        id:
          type: string
        sessionId:
          type: string
        text:
          type: string
        createdAt:
          type: integer
        retractedAt:
          type:
            - integer
            - "null"
    AmendmentCreated:
      type: object
      additionalProperties: true
      required:
        - amendment
        - steered
      properties:
        amendment:
          $ref: "#/components/schemas/TaskAmendment"
        steered:
          type: boolean
    ReadyRequest:
      type: object
      additionalProperties: false
      required:
        - ready
      description: POST /api/sessions/{id}/ready — the manual "parked / ready to merge" flag, orthogonal to SessionStatus.
      properties:
        ready:
          type: boolean
    RelaunchResult:
      type: object
      additionalProperties: true
      required:
        - session
        - archived
      properties:
        session:
          $ref: "#/components/schemas/Session"
        archived:
          type: boolean
          description: Whether the original was torn down. False means the replacement spawned but the original is still on the list and needs closing by hand.
    RecapState:
      anyOf:
        - $ref: "#/components/schemas/RecapStateKnown"
        - type: string
    RecapStateKnown:
      type: string
      enum:
        - generating
        - ready
        - failed
        - empty
    RecapVerdict:
      anyOf:
        - $ref: "#/components/schemas/RecapVerdictKnown"
        - type: string
    RecapVerdictKnown:
      type: string
      enum:
        - ready
        - parked
        - needs_attention
    Recap:
      type: object
      additionalProperties: true
      description: The documented subset of src/types.ts Recap the native action bar reads. The server sends more; additionalProperties keeps the rest legal.
      required:
        - sessionId
        - state
        - headline
        - body
        - openItems
        - updatedAt
      properties:
        sessionId:
          type: string
        state:
          $ref: "#/components/schemas/RecapState"
        verdict:
          $ref: "#/components/schemas/RecapVerdict"
        headline:
          type: string
          description: At most 100 characters; "" until ready.
        body:
          type: string
          description: Markdown; "" until ready.
        openItems:
          type: array
          items:
            type: string
        changedFiles:
          type: array
          items:
            type: string
        generatedAt:
          type:
            - integer
            - "null"
        updatedAt:
          type: integer
    RecapMap:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/Recap"
      description: GET /api/recaps. Session id -> recap. Absent means no recap exists for that session.
    RecapRegenerateStatus:
      anyOf:
        - $ref: "#/components/schemas/RecapRegenerateStatusKnown"
        - type: string
    RecapRegenerateStatusKnown:
      type: string
      enum:
        - started
        - empty
        - error
    RecapRegenerateResult:
      type: object
      additionalProperties: true
      required:
        - ok
        - status
      properties:
        ok:
          type: boolean
        status:
          $ref: "#/components/schemas/RecapRegenerateStatus"
    SessionRecapEvent:
      type: object
      additionalProperties: true
      required:
        - id
        - recap
      properties:
        id:
          type: string
        recap:
          $ref: "#/components/schemas/Recap"
    SessionAmendmentsEvent:
      type: object
      additionalProperties: true
      description: Always the session's FULL current amendment list, so an empty array is a genuine all-clear (src/service.ts emitSessionAmendments).
      required:
        - id
        - amendments
      properties:
        id:
          type: string
        amendments:
          type: array
          items:
            $ref: "#/components/schemas/TaskAmendment"
  responses:
    Unauthorized:
      description: Missing or invalid credential.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
paths:
  /api/health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Server is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/login:
    post:
      operationId: login
      security: []
      description: Password login. Sets the shepherd_session cookie. The native client uses it once to mint an access token, then discards the cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in; Set-Cookie carries the session.
          headers:
            Set-Cookie:
              required: true
              description: "shepherd_session cookie (login: signed session; logout: cleared with Max-Age=0)."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          description: Wrong password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/logout:
    post:
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Session cookie cleared.
          headers:
            Set-Cookie:
              required: true
              description: "shepherd_session cookie (login: signed session; logout: cleared with Max-Age=0)."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/access-tokens:
    get:
      operationId: listAccessTokens
      security:
        - cookieAuth: []
      responses:
        "200":
          description: All tokens (no plaintext).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not an operator session (a bearer token cannot manage tokens).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: mintAccessToken
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessTokenMintRequest"
      responses:
        "201":
          description: Token minted; plaintext shown exactly once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenMinted"
        "400":
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not an operator session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/access-tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: revokeAccessToken
      description: Revokes one token. An operator session may revoke any token; a bearer access token may revoke ITSELF and nothing else, which is how a native client invalidates its own credential on logout. Self-revocation is allowed whatever the token's scope.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Only an operator session may revoke other tokens; a bearer token may revoke itself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown token id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: Operator settings incl. first-run state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: putRepoRoot
      description: Only the repoRoot form is part of this contract; it also resolves the first-run picker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoRootRequest"
      responses:
        "200":
          description: Repo root stored; first run resolved if it was pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoRootResponse"
        "400":
          description: Not an existing directory under the root ceiling.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sessions:
    get:
      operationId: listSessions
      description: Active (non-archived) sessions, oldest first. No pagination.
      responses:
        "200":
          description: Sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSession
      description: Creates and spawns a session, or answers 200 with a held task when the usage hold trips (force overrides the hold).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "200":
          description: Usage hold tripped — queued as a held task instead of spawned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeldTask"
        "201":
          description: Session created and agent spawned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid input (see error text).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: First run pending, name taken, worktree occupied, or herdr restart required (see code).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The base branch does not resolve to a ref in the repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Create failed downstream (git or the agent runner).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/done:
    get:
      operationId: listDoneSessions
      description: Recently archived sessions for the Done lens.
      responses:
        "200":
          description: Sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getSession
      responses:
        "200":
          description: Session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: archiveSession
      description: Archives the session (stops the agent, keeps the row). Always 200.
      responses:
        "200":
          description: Archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sessions/{id}/interrupt:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: interruptSession
      responses:
        "200":
          description: Interrupt delivered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/repos:
    get:
      operationId: listRepos
      responses:
        "200":
          description: Repos under the workspace root.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sessions/{id}/reply:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: replySession
      description: Steer a running session with operator free text. The text is delivered to the session's live agent pane. An unknown id, an unreachable herdr, or a dead pane is 404 — a normal outcome for a caller whose session list is a tick stale.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyRequest"
      responses:
        "200":
          description: The text was delivered to the agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: "The body was not {text: string}."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id, or the session has no live agent pane.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Content-Type was not application/json.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/activity:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getSessionActivity
      description: Recent tool use from the agent transcript. An unreadable transcript is an empty list.
      responses:
        "200":
          description: Activity, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/diff:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getSessionDiff
      description: The session branch against its base. Files carry `patch`, not parsed hunks.
      responses:
        "200":
          description: Diff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiffResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: git failed (missing worktree, unresolvable base).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/diff/annotations:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getSessionDiffAnnotations
      description: Agent and review notes on the diff. Best effort — any failure answers an empty list.
      responses:
        "200":
          description: Notes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiffAnnotations"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/scratchpad:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: query
        required: false
        description: Directory relative to the scratchpad root; omitted lists the root.
        schema:
          type: string
    get:
      operationId: getSessionScratchpad
      responses:
        "200":
          description: One directory of the scratchpad.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowseListing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown or archived session, or a path that is not a directory under the root.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/worktree:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: query
        required: false
        description: Directory relative to the worktree root; omitted lists the root.
        schema:
          type: string
    get:
      operationId: getSessionWorktree
      description: Read-only worktree listing. `.git` is hidden; symlinks out of the root are marked.
      responses:
        "200":
          description: One directory of the worktree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowseListing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown or archived session, or a path that is not a directory under the root.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/git:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getSessionGit
      description: PR and forge state. 404 covers both an unknown session and a repo with no forge.
      responses:
        "200":
          description: Git state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id, or no forge for this repo.
          content:
