            - integer
            - "null"
          description: The push service's HTTP status; null when nothing was sent.
        reason:
          type:
            - string
            - "null"
          description: The push service's reason (BadDeviceToken, …) or not_configured.
    HerdrRuntimeStatus:
      type: object
      additionalProperties: true
      required:
        - state
        - installedVersion
        - serverVersion
      properties:
        state:
          type: string
        installedVersion:
          type:
            - string
            - "null"
        serverVersion:
          type:
            - string
            - "null"
        reason:
          type: string
    HerdrUpdateResult:
      type: object
      additionalProperties: true
      required:
        - ok
        - from
        - to
      properties:
        ok:
          type: boolean
        from:
          type:
            - string
            - "null"
        to:
          type:
            - string
            - "null"
        error:
          type: string
        serverVersion:
          type:
            - string
            - "null"
        errorCode:
          type: string
        handoffPaneLimit:
          type: integer
    HerdrUpdateStatus:
      type: object
      additionalProperties: true
      required:
        - current
        - latest
        - updateAvailable
        - notes
        - checkedAt
      properties:
        current:
          type:
            - string
            - "null"
        latest:
          type:
            - string
            - "null"
        updateAvailable:
          type: boolean
        notes:
          type:
            - string
            - "null"
        checkedAt:
          type: integer
        error:
          type: string
        runtime:
          $ref: "#/components/schemas/HerdrRuntimeStatus"
        phase:
          type: string
        operation:
          type: object
          additionalProperties: true
          required:
            - from
            - to
          properties:
            from:
              type:
                - string
                - "null"
            to:
              type:
                - string
                - "null"
        result:
          $ref: "#/components/schemas/HerdrUpdateResult"
        revision:
          type: integer
        latestUnsupported:
