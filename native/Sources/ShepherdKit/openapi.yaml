        "200":
          description: Removed (also for a row that was not there).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: error is "invalid repo" or "parent must be a positive integer".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/epics/completed/ack-migrations:
    post:
      operationId: ackCompletedEpicMigrations
      description: Acknowledge the migrations detected in the landing PR and remove the row in one step. Lands as epic:completed-cleared.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletedEpicTarget"
      responses:
        "200":
          description: Acknowledged and removed.
