  responses:
    Unauthorized:
      description: Missing or invalid credential.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
paths:
  /api/health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Server is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/pairing-codes:
    post:
      operationId: mintPairingCode
      security:
        - cookieAuth: []
      description: Create an ephemeral single-use iPhone pairing invitation. Only operator sessions may mint one; at most five invitations remain outstanding.
      responses:
        "201":
          description: Pairing invitation; never cache or log it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingCode"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Operator session required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/pair:
    post:
      operationId: pairDevice
      security: []
      description: Consume a pairing invitation and mint a full-scope access token with no expiry. The code is consumed before minting; it cannot be reused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairRequest"
      responses:
        "201":
          description: Device paired; plaintext token returned exactly once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenMinted"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid, expired or used invitation (pairing_code_invalid).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Request body over 1 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many pairing attempts; retry after sixty seconds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/login:
    post:
      operationId: login
      security: []
      description: Password login. Sets the shepherd_session cookie. The native client uses it once to mint an access token, then discards the cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in; Set-Cookie carries the session.
          headers:
            Set-Cookie:
              required: true
              description: "shepherd_session cookie (login: signed session; logout: cleared with Max-Age=0)."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          description: Wrong password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Request body over 4 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many login attempts from this peer (login_rate_limited); retry after sixty seconds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/logout:
    post:
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Session cookie cleared.
          headers:
            Set-Cookie:
              required: true
              description: "shepherd_session cookie (login: signed session; logout: cleared with Max-Age=0)."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/me:
    get:
      operationId: getAuthenticatedIdentity
      responses:
        "200":
          description: Current identity and token permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedIdentity"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/instance:
    get:
      operationId: getInstance
      description: This instance's identity, verified capabilities and current host load for machine connections. Needs a full-scope credential without a repository restriction.
      responses:
        "200":
          description: Instance identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceIdentity"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/access-tokens:
    get:
      operationId: listAccessTokens
      security:
        - cookieAuth: []
      responses:
        "200":
          description: All tokens (no plaintext).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not an operator session (a bearer token cannot manage tokens).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: mintAccessToken
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessTokenMintRequest"
      responses:
        "201":
          description: Token minted; plaintext shown exactly once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenMinted"
        "400":
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not an operator session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/access-tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateAccessTokenRepositories
      description: Update only repository grants, preserving the token, scope and expiry. Closes existing token WebSockets so they reauthenticate.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessTokenRepositoryRequest"
      responses:
        "200":
          description: Updated permissions; no plaintext token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenUpdated"
        "400":
          description: Invalid body or repository.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not an operator session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown token id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: revokeAccessToken
      description: Revokes one token. An operator session may revoke any token; a bearer access token may revoke ITSELF and nothing else, which is how a native client invalidates its own credential on logout. Self-revocation is allowed whatever the token's scope.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Only an operator session may revoke other tokens; a bearer token may revoke itself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown token id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/settings:
    get:
      operationId: getSettings
      parameters:
        - name: host
          in: query
          description: Registered machine instance ID, or local (default). Unknown or restricted machines return 404; unreachable machines return 502.
          schema:
            type: string
      responses:
        "200":
          description: Operator settings incl. first-run state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: putRepoRoot
      description: Only the repoRoot form is part of this contract; it also resolves the first-run picker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoRootRequest"
      responses:
        "200":
          description: Repo root stored; first run resolved if it was pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoRootResponse"
        "400":
          description: Not an existing directory under the root ceiling.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: patchSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsPatchResult"
        "400":
          description: Handler refusal; see the verified status matrix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sessions:
    get:
      operationId: listSessions
      description: Active (non-archived) sessions, oldest first. No pagination.
      parameters:
        - in: header
          name: If-None-Match
          schema:
            type: string
      responses:
        "200":
          description: Sessions.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "304":
          description: Representation unchanged; no response body.
          headers:
            ETag:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSession
      description: "Creates and spawns a session, or answers 200 with a held task when the usage hold trips (force overrides the hold). While a machine is connected and no `target` is given, this instance chooses the machine itself (POST /api/placement shows the choice): machines whose platform is released, that have the project and whose report has every requirement, ranked by platform (Linux before macOS by default, this instance's machinePlatformOrder setting), then by instance ID. When the preferred connected machine has fresh one-minute host load per logical CPU at or above 1.0, the first fitting connected alternative at or below 0.75 can take the task. Load older than 15 seconds is unknown. Without proven spare capacity the preferred machine still starts it; explicit targets are never overridden by load. The choice and load observations are recorded as `launchMetadata.placement`. Started on another machine — chosen or named in `target` — the 201 session and the 200 held task carry `host`, and nothing starts here. When the chosen machine is out of reach (#2775) the task waits here for it: 200 with `waiting` (a HeldTask); nothing is sent or uploaded until that machine can take it, and nothing falls back to another machine. A keyed retry goes where its first submission went."
      parameters:
        - name: X-Shepherd-Spawn-Id
          in: header
          required: false
          description: Client-chosen correlation id for this create. With a valid one the caller receives live `spawn:progress` frames and may cancel through POST /api/spawns/{id}/cancel; without one the spawn still runs and is still measured. Deliberately a header and not a body field (src/server.ts:2400-2404) — a usage hold persists the BODY, so a spawn id there would be replayed stale when the held task is finally spawned. Header names are case-insensitive; the server compares lowercase.
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          description: "Client-chosen id that makes this submission run at most once (#2761). Reserved before the hold gate and the spawn, and kept across restarts: a retry or a concurrent duplicate with the same key and the same body gets the first outcome replayed (marked `Idempotent-Replayed: true`) — the session (201) or the held task (200) — without a second spawn, and a failed outcome is final for its key. The same key with a different body is 409. Matches ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$, optionally double-quoted (structured-field string); anything else is 400. Outcome: GET /api/dispatches/{id}."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "200":
          description: "Usage hold tripped — queued as a held task instead of spawned (with `host`: held on that machine), or waiting on its afterSession predecessor (reason `after`). With `waiting`: chosen automatically for a machine that is out of reach, the task waits here for it (#2775)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeldTask"
        "201":
          description: Session created and agent spawned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: "Invalid input (see error text). Also afterSession with a target naming another machine (after_remote): a dependent task runs where its predecessor lives, so the automatic choice keeps it here."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: afterSession names no task (after_not_found).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "First run pending, name taken, worktree occupied, or herdr restart required (see code). With an Idempotency-Key also: the key was used with a different body (dispatch_payload_mismatch), was withdrawn before it arrived (dispatch_canceled), or its first start was cut off by a restart (dispatch_interrupted). With a target also: the machine is not reachable right now and nothing was sent (remote_target_unavailable, `reason` says why), or the task was canceled before the machine confirmed it and never starts under that key (remote_dispatch_canceled), or it was canceled here but the machine has not confirmed the cancel yet — the task may have reached it first and be running there; it is not sent again (remote_dispatch_cancel_pending). With afterSession also: the predecessor was archived without its PR landing (after_not_landed)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "The base branch (or the requested baseCommit) does not resolve to a commit in the repo, or this instance does not meet a requirement (code `missing_capabilities`; `error` names each unmet capability and its reason, and `missing` lists them as `{capability, reason}`). A keyed retry (Idempotency-Key) replays the refusal from the dispatch record with `error` and `code` only, without `missing`. With a target also: the machine refused the task (remote_rejected — `error` is its reason, `remoteStatus`/`remoteCode` its answer, `host` the machine), no connected machine has that ID (remote_target_unknown), the machine's platform is not released for tasks (remote_target_unreleased — `reason` is the platform, e.g. windows), the machine has no checkout of the project (remote_project_missing), the repo has no forge identity (remote_project_unknown), or the machine's report lacks a requirement (missing_capabilities with `host`; reason not_verified when no fresh report confirms it). Chosen automatically also: no machine fits (no_suitable_machine — `missing` lists the capabilities no connected machine with the project has)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: "Create failed downstream (git or the agent runner). With a target also: an attachment did not reach the machine, so the task was not sent and nothing started (remote_upload_failed — `error` says which and why, `host` the machine); it is never sent under that Idempotency-Key."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: "With a target: the task was sent but no answer came back, so it may have started on the machine (remote_dispatch_unknown — start status unknown). This instance keeps asking the machine and settles it (GET /api/remote-dispatches, remote:dispatch). Sending it again with the Idempotency-Key in `dispatchId` is safe too — it goes to the same machine and never starts twice."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/done:
    get:
      operationId: listDoneSessions
      description: Recently archived sessions for the Done lens.
      parameters:
        - in: header
          name: If-None-Match
          schema:
            type: string
      responses:
        "200":
          description: Sessions.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "304":
          description: Representation unchanged; no response body.
          headers:
            ETag:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sessions/archived:
    get:
      operationId: listArchivedSessions
      description: Every archived session, newest-first by archive time. No pagination.
      responses:
        "200":
          description: Sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getSession
      description: One session, archived included. The bare GET also takes a designation (`TASK-07`, or the bare number `7`) in place of the id; the sub-routes take the id only.
      responses:
        "200":
          description: Session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: archiveSession
      description: Archives the session (stops the agent, keeps the row). An unknown id is a no-op 200. A worktree the server cannot fully delete is logged, never a failure.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveSessionRequest"
      responses:
        "200":
          description: Archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Teardown failed (e.g. herdr could not stop the agent); the session stays active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/terminal:
    post:
      operationId: createSessionTerminal
      description: Open a clean terminal in this session's repository, on its owning machine. Reuses the existing terminal singleton; a conflict identifies the existing terminal.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Created terminal session, annotated with its machine when forwarded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Session or machine not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Terminal already exists or is unsupported on this machine.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Terminal creation failed or the owning machine is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/interrupt:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: interruptSession
      responses:
        "200":
          description: Interrupt delivered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/repos:
    get:
      operationId: listRepos
      parameters:
        - name: host
          in: query
          description: Registered machine instance ID, or local (default). Unknown or restricted machines return 404; unreachable machines return 502.
          schema:
            type: string
      responses:
        "200":
          description: Repos under the workspace root.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/operator-assistant:
    get:
      operationId: getOperatorAssistant
      description: Whether the Operator Assistant can run, why not, the global live session, and every live assistant including the repo-scoped ones (#1446).
      responses:
        "200":
          description: Availability and the live assistant rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAssistantState"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: ensureOperatorAssistant
      description: Return the live Operator Assistant of one scope — the global one, or with repo that repo's own — spawning it on first use or resuming it when its agent is gone. At most one live assistant per scope. Emits operator-assistant:update.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorAssistantScopeRequest"
      responses:
        "200":
          description: The live assistant of that scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAssistantSession"
        "400":
          description: The body is malformed or names an unknown repo. Nothing was spawned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Refused, e.g. herdr needs a restart first (code herdr_restart_required).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The assistant could not be spawned or resumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The assistant cannot run here (see reason). Nothing was spawned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAssistantUnavailable"
  /api/operator-assistant/reset:
    post:
      operationId: resetOperatorAssistant
      description: New conversation — archive the live Operator Assistant of one scope (the global one, or with repo that repo's own) and spawn a fresh one in it. Emits operator-assistant:update.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorAssistantScopeRequest"
      responses:
        "200":
          description: The fresh assistant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAssistantSession"
        "400":
          description: The body is malformed or names an unknown repo. Nothing was archived or spawned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Refused, e.g. herdr needs a restart first (code herdr_restart_required).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The fresh assistant could not be spawned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The assistant cannot run here (see reason). Nothing was archived or spawned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAssistantUnavailable"
  /api/operator-assistant/close:
    post:
      operationId: closeOperatorAssistant
      description: Close a repo's Operator Assistant — archive its live row; nothing respawns. Never the global assistant. Works while the assistant can't run. Emits operator-assistant:update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorAssistantCloseRequest"
      responses:
        "200":
          description: Closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: No repo, a malformed body, or a repo that is neither known nor has a live assistant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: That repo has no live assistant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/dispatches/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The Idempotency-Key a POST /api/sessions was (or will be) sent with.
        schema:
          type: string
    get:
      operationId: getDispatch
      description: What became of a keyed submission. A key still pending with no start running (the server restarted mid-start) reads as failed with code dispatch_interrupted; it is never re-spawned.
      responses:
        "200":
          description: The dispatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispatch"
        "400":
          description: Malformed id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The key never arrived — sending it again (same key, same body) is safe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: cancelDispatch
      description: Make sure the key never starts a session. An unknown key is reserved as withdrawn (failed, dispatch_canceled), so a late arrival with it is refused instead of started; an already-failed key stays failed. Idempotent.
      responses:
        "200":
          description: The key can no longer start; the dispatch is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispatch"
        "400":
          description: Malformed id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The key already arrived (pending, started or held) — code dispatch_arrived, with the current dispatch under `dispatch`. Archive the session or discard the held task instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/remote-dispatches:
    get:
      operationId: listRemoteDispatches
      description: "Tasks for connected machines that are not settled: sent but not confirmed by the machine (start status unknown, or a cancel on its way), waiting here for their machine, or held there (#2775). Oldest first; only machines still registered here (connected or not). remote:dispatch announces every change of one, including the one that resolves it, and a waiting one again whenever its readiness or alternatives change."
      responses:
        "200":
          description: The unconfirmed dispatches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteDispatchList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/remote-dispatches/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The dispatch ID, as GET /api/remote-dispatches lists it.
        schema:
          type: string
    delete:
      operationId: cancelRemoteDispatch
      description: "Cancel a task no machine has confirmed: the machine's DELETE /api/dispatches/{id} makes sure it never starts there, even if the task arrives late. Until the cancel reaches the machine nothing sends the task again, and a retry under its Idempotency-Key is refused (remote_dispatch_cancel_pending while the cancel is on its way, remote_dispatch_canceled once the machine confirmed it). A waiting task (#2775) was never sent: it is canceled at once. A task its machine holds is discarded there (DELETE /api/held/{heldId}) and canceled once the machine's dispatch record confirms it; if it started first, it is not cancelable. Idempotent."
      responses:
        "200":
          description: Canceled — it never starts on the machine.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteDispatch"
        "202":
          description: "The machine is out of reach: the cancel (state canceling) is delivered as soon as it answers."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteDispatch"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such dispatch, or its machine was removed here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Not cancelable (remote_dispatch_not_cancelable): it is being sent right now, or the machine already has it — `dispatch` (a RemoteDispatch) says what it is now."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/remote-dispatches/{id}/redirect:
    parameters:
      - name: id
        in: path
        required: true
        description: The dispatch ID of a waiting task, as GET /api/remote-dispatches lists it.
        schema:
          type: string
    post:
      operationId: redirectRemoteDispatch
      description: Run a task that waits for its machine (#2775) on another one now — a connected machine or this instance. It must fit as a machine named in `target` must fit (connected, released, the project checked out, every requirement verified); otherwise the refusal is answered and the task keeps waiting. On another machine it is sent under the same dispatch ID (it was never sent) and answered as POST /api/sessions answers a task for a machine; if that machine cannot take it yet, it waits for that one instead (200 with `waiting`). On this instance it starts under the task's own Idempotency-Key, so a retry of the original create replays this start. The choice is recorded as manual. `full` scope only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedirectRequest"
      responses:
        "200":
          description: Held on the machine it went to, held here by the usage hold, or (`waiting`) waiting for the new machine, which could not take it yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeldTask"
        "201":
          description: Started there (the session, with `host` on another machine) or here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: "The body was not {target: {instanceId}}, or the stored task no longer validates here (e.g. its attachments are gone)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such dispatch, or its machine was removed here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Not waiting (remote_dispatch_not_redirectable — `dispatch` says what it is now), the machine is not reachable right now (remote_target_unavailable), or a create conflict here (see POST /api/sessions).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The machine does not fit (missing_capabilities with `host` and `missing`, remote_target_unknown, remote_target_unreleased, remote_project_missing), or it refused the task (remote_rejected).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: An attachment did not reach the machine (remote_upload_failed), or the create here failed downstream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: Sent, but no answer came back (remote_dispatch_unknown — start status unknown); this instance keeps asking the machine.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/placement:
    post:
      operationId: previewPlacement
      description: Where a new task would run and why — decided exactly as POST /api/sessions decides it for the same repoPath, requirements and target with the same readiness, so a form can show it before submitting. Nothing is stored or sent. While no connected machine could take a task `active` is false. Otherwise the answer has either `placement` (the target and the reason) or `refusal` (what POST /api/sessions would answer). With `wait` beside `placement`, that machine is out of reach and the task would wait for it (#2775).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlacementRequest"
      responses:
        "200":
          description: The machine and the reason, the refusal, or that the choice is not active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacementPreview"
        "400":
          description: Invalid input (see error text).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The token is restricted to other repositories (repository_not_allowed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/requirements/derive:
    post:
      operationId: deriveRequirements
      description: "Read a new task's requirements from its prompt, attached issue and staged screenshots, before it is submitted (New Task does this while the operator is still writing). Answers `skipped` only while no machine is connected. The decision model (judge), when armed, answers a task without screenshots in one request; otherwise, and whenever it fails, a transient helper reads the task and its screenshots, never the repository, within 30 seconds. POST /api/sessions never derives: send what this answers (or what the operator made of it) as `requirements`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequirementsDeriveRequest"
      responses:
        "200":
          description: The derived requirements, the alternatives to ask about, or why there are none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementsDerivation"
        "400":
          description: Invalid input (see error text).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The token is restricted to other repositories (repository_not_allowed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/reply:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: replySession
      description: Steer a running session with operator free text. The text is delivered to the session's live agent pane. An unknown id, an unreachable herdr, or a dead pane is 404 — a normal outcome for a caller whose session list is a tick stale.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyRequest"
      responses:
        "200":
          description: The text was delivered to the agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: "The body was not {text: string}."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id, or the session has no live agent pane.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Content-Type was not application/json.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/activity:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getSessionActivity
      description: Recent tool use from the agent transcript. An unreadable transcript is an empty list.
      responses:
        "200":
          description: Activity, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/steer-log:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getSessionSteerLog
      description: Every message typed into the session since it started — Shepherd's own steers and the operator's replies — as time and channel only, never the text.
      responses:
        "200":
          description: Steer log, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SteerLogList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getSessionMessages
      description: The agent's last text messages from its transcript (Claude JSONL or Codex rollout), and whether it waits on a question. Needs a `full` token.
      parameters:
        - name: limit
          in: query
          required: false
          description: How many of the newest messages to return (0-100, default 5). 0 returns only the flags.
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: includeUser
          in: query
          required: false
          description: Also return the user's and the operator's steering messages.
          schema:
            type: boolean
      responses:
        "200":
          description: Messages and the open-question flags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionMessages"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/diff:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: worktree
        in: query
        required: false
        description: "true diffs the fork point (merge-base of base and HEAD) against the working tree, so uncommitted edits to tracked files show; untracked files never do. Default: committed only."
        schema:
          type: boolean
    get:
      operationId: getSessionDiff
      description: The session branch against its base. Files carry `patch`, not parsed hunks.
      responses:
        "200":
          description: Diff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiffResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: git failed (missing worktree, unresolvable base).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/diff/annotations:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getSessionDiffAnnotations
      description: Agent and review notes on the diff. Best effort — any failure answers an empty list.
      responses:
        "200":
          description: Notes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiffAnnotations"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/scratchpad:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: query
        required: false
        description: Directory relative to the scratchpad root; omitted lists the root.
        schema:
          type: string
    get:
      operationId: getSessionScratchpad
      responses:
        "200":
          description: One directory of the scratchpad.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowseListing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown or archived session, or a path that is not a directory under the root.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/worktree:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: query
        required: false
        description: Directory relative to the worktree root; omitted lists the root.
        schema:
          type: string
    get:
      operationId: getSessionWorktree
      description: Read-only worktree listing. `.git` is hidden; symlinks out of the root are marked.
      responses:
        "200":
          description: One directory of the worktree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowseListing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown or archived session, or a path that is not a directory under the root.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/worktree/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getSessionWorktreeStatus
      description: "Live git state of the worktree against its base (the PR's base, else the session's): fork point, behind/ahead, unpushed commits and the dirty flag. Fetches the base first."
      responses:
        "200":
          description: Worktree status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorktreeStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown or archived session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: git failed (missing worktree, unresolvable base).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/worktree/download:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: query
        required: true
        description: File relative to the worktree root.
        schema:
          type: string
    get:
      operationId: getSessionWorktreeFile
      description: One worktree file's bytes, as an attachment. `.git`, root escapes and symlinks out of the root are refused as 404.
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown or archived session, or a path that is not a file under the root.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/git:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getSessionGit
      description: PR and forge state. 404 covers both an unknown session and a repo with no forge.
      responses:
        "200":
          description: Git state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id, or no forge for this repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The forge failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/git/pr:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: openPullRequest
      description: Opens a PR for the session branch. Answers the bare PR status — no `kind`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenPrBody"
      responses:
        "200":
          description: PR opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id, or no forge for this repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: No commits to merge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The forge failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/git/merge:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: mergePullRequest
      description: Merges the open PR. Answers the bare PR status — no `kind`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergePrBody"
      responses:
        "200":
          description: Merged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id, or no forge for this repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: No open PR (code pr_already_merged/pr_already_closed/pr_not_found), a merge conflict, a busy base checkout, missing/stale takeover confirmation (code merge_confirm_required/merge_confirm_stale), or a stack untested against its trunk's current tip (code stack_untested).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The forge failed, or the host only enqueued the merge (see `code`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/git/ready:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: setPullRequestReady
      description: Marks the PR ready for review. Idempotent when it already is.
      responses:
        "200":
          description: Git state after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitState"
        "400":
          description: This forge cannot change draft state (no `markReady`, e.g. LocalForge).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id, or no forge for this repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "No open PR, or draft mode still awaiting sign-off (`code: draft_awaiting_signoff`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The forge failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/git/draft:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: setPullRequestDraft
      description: Converts the PR back to a draft. Idempotent when it already is one.
      responses:
        "200":
          description: Git state after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitState"
        "400":
          description: This forge cannot change draft state (no `convertToDraft`, e.g. LocalForge).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id, or no forge for this repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: No open PR.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The forge failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/git/close:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: closePullRequest
      responses:
        "200":
          description: Git state after the close.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitState"
        "400":
          description: This forge cannot close PRs (no `closePr`, e.g. LocalForge).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id, or no forge for this repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: No open PR (code pr_already_merged/pr_already_closed/pr_not_found).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The forge failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/git/reviewers:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPullRequestReviewers
      description: Candidate reviewers for the open PR. GitHub only.
      responses:
        "200":
          description: Reviewer options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrReviewerOptions"
        "400":
          description: "This forge cannot request reviews (`code: review_request_unsupported`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCodeError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id, or no forge for this repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "No open PR to request a review on (`code: review_request_stale`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCodeError"
        "502":
          description: "The forge failed (`code: review_request_failed`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCodeError"
  /api/sessions/{id}/git/request-review:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: requestPullRequestReview
      description: Requests a human review. GitHub only; an already-requested reviewer is a no-op success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequestBody"
      responses:
        "200":
          description: Requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewRequestAck"
        "400":
          description: Unsupported forge, or an invalid body/reviewer (`code`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCodeError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "The host forbids this review request (`code: review_request_forbidden`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCodeError"
        "404":
          description: Unknown id, or no forge for this repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The PR is stale or still a draft (`code`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCodeError"
        "422":
          description: "The host rejects the reviewer login (`code: review_request_invalid_reviewer`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCodeError"
        "502":
          description: "The forge failed (`code: review_request_failed`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCodeError"
  /api/working-blocked:
