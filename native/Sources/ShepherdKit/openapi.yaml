          description: The rate-limit windows plus their projections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageLimitsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sessions/{id}/resume:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: resumeSession
      description: Resume a finished session. Adopts a live pane unless `force`, which tears the husk down and respawns. 409 covers every "cannot resume" case, including an unknown id.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeRequest"
      responses:
        "200":
          description: The resumed session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Cannot resume — unknown id, archived, no conversation to resume, or refused by the auto gate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/rename:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: renameSession
      description: Rename the session. The git branch moves too unless an open PR pins it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameRequest"
      responses:
        "200":
          description: The renamed session and whether its branch moved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenameResult"
        "400":
          description: Body is not {name -> non-blank string}.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: error is "name_taken" — the target branch name is already in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/amendments:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: amendSession
      description: Record an operator scope amendment beside the original task. Persisted first, steered second, so `steered false` never means "not recorded".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmendmentRequest"
      responses:
        "201":
          description: The recorded amendment and whether it reached the agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmendmentCreated"
        "400":
          description: Missing, blank or over-long text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/ready:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: setSessionReady
      description: Set or clear the manual ready-to-merge flag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadyRequest"
      responses:
        "200":
          description: Flag applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: Body is not {ready -> boolean}.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/relaunch:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: relaunchSession
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelaunchRequest"
      description: Spawn a fresh replacement carrying the original's prompt and settings, then decommission the original. Destructive — the original's worktree goes away. Absent fields inherit the original session.
      responses:
        "201":
          description: The replacement, and whether the original was torn down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelaunchResult"
        "400":
          description: The body carried an unknown or invalid override key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already archived, or a relaunch of this id is in flight (code "in_progress").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The replacement could not be spawned, or a same-repo relaunch could not re-resolve the linked issue (code "issue_unresolved"). The original is left intact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/recap:
    get:
      operationId: getSessionRecap
      description: Read the full persisted recap including blocks, without regeneration. Available for live and archived sessions.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full recap including grounded visual blocks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recap"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown session or no recap exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/recap/regenerate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: regenerateRecap
      description: Force a fresh recap for this session. Accepted, not completed — the recap arrives later as a session:recap frame.
      responses:
        "202":
          description: Accepted, with what the regenerate actually did.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecapRegenerateResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/recaps:
    get:
      operationId: listRecaps
      parameters:
        - name: host
          in: query
          description: Registered machine instance ID, or local (default). Unknown or restricted machines return 404; unreachable machines return 502.
          schema:
            type: string
        - in: header
          name: If-None-Match
          schema:
            type: string
      description: Bootstrap snapshot of every recap summary, without blocks.
      responses:
        "200":
          description: Session id -> recap.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecapMap"
        "304":
          description: Representation unchanged; no response body.
          headers:
            ETag:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/git:
    get:
      operationId: gitStates
      parameters:
        - name: host
          in: query
          description: Registered machine instance ID, or local (default). Unknown or restricted machines return 404; unreachable machines return 502.
          schema:
            type: string
      description: Every session's cached PR state in one read. The herd classifier's bootstrap; session:git keeps it current afterwards.
      responses:
        "200":
          description: Session id to PR state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitStateMap"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/activity:
    get:
      operationId: activityStates
      parameters:
        - name: host
          in: query
          description: Registered machine instance ID, or local (default). Unknown or restricted machines return 404; unreachable machines return 502.
          schema:
            type: string
      description: Every session's transcript heartbeat in one read. Bootstraps the row heartbeat strip; session:activity keeps it current.
      responses:
        "200":
          description: Session id to heartbeat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityMap"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/claude-alive:
    get:
      operationId: claudeAliveStates
      parameters:
        - name: host
          in: query
          description: Registered machine instance ID, or local (default). Unknown or restricted machines return 404; unreachable machines return 502.
          schema:
            type: string
      description: Every session's coding-CLI liveness in one read. session:claude-alive re-emits on flips only, so a client that reconnects mid-flip needs this.
      responses:
        "200":
          description: Session id to liveness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaudeAliveMap"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/reviews:
    get:
      operationId: listReviews
      parameters:
        - name: host
          in: query
          description: Registered machine instance ID, or local (default). Unknown or restricted machines return 404; unreachable machines return 502.
          schema:
            type: string
      description: Every session's latest critic verdict. Bootstraps the critic badge and the needsRework stage.
      responses:
        "200":
          description: Session id to verdict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewVerdictMap"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/reviews/inflight:
    get:
      operationId: listReviewsInflight
      parameters:
        - name: host
          in: query
          description: Registered machine instance ID, or local (default). Unknown or restricted machines return 404; unreachable machines return 502.
          schema:
            type: string
      description: The critic runs in flight right now, with the CLI/model/effort each is using. Reconstructs the reviewerRunning stage after a reload.
      responses:
        "200":
          description: One row per in-flight run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewerInflightList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sessions/{id}/review-pr:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: reviewPr
      description: Force a critic review of this session's PR. Answers 202 with what it did — the run itself is asynchronous and lands as session:reviewing then session:review.
      responses:
        "202":
          description: Accepted. `status` says whether a run actually started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrReviewResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 'Two bodies, same status: error is "not found" for an unknown id, or "no forge for this repo" when the repo has no forge configured.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The forge lookup threw while resolving the PR state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/review-hold:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: holdReview
      description: Hold (or release) whichever review — critic or plan gate — is in flight. While held the reviewer keeps running, but its result is neither settled nor pasted; held time does not count toward the review timeout. Lands as session:review-held.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewHoldRequest"
      responses:
        "200":
          description: Held or released.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewHoldResult"
        "400":
          description: 'error is "body must be {held: boolean}".'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: error is "no review in flight". Also the answer for an unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/review-cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: cancelReview
      description: Kill whichever review is in flight and discard its work — no verdict, no paste, no round. It is not re-run automatically until the PR head or the plan changes; a forced review (review-pr / review-plan) restarts it. Lands as session:reviewing / session:plangate-reviewing with reviewing false.
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCancelResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: 'Two bodies: "no review in flight" (also for an unknown id), and "review is finalizing" when its result is already landing.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/epics/completed:
    get:
      operationId: listCompletedEpics
      description: 'The "Epics to land" band: every completed epic nobody removed, newest first. Live landing signals ride only here (see CompletedEpic), so a client re-reads this while a row''s landing PR is open — the web every 60 s while visible. Never fails on a forge error: the row is served without its live signals.'
      parameters:
        - name: repo
          in: query
          required: false
          description: Only this repo's rows.
          schema:
            type: string
      responses:
        "200":
          description: The rows, possibly empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletedEpicList"
        "400":
          description: error is "invalid repo".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/epics/completed/land:
    post:
      operationId: landCompletedEpic
      description: "Merge the epic's open landing PR with the repo's merge method, fail-closed: only when the PR is green and mergeable right now. The merge runs before the answer; the row then arrives as epic:completed with landingState merged."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletedEpicTarget"
      responses:
        "200":
          description: Landed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: error is "invalid repo" or "parent must be a positive integer".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: 'Not landable: "no completed epic", "landing not open", "no forge", "no integration branch" or "landing PR not ready".'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: 'The forge failed: "landing PR status check failed" or "landing merge failed".'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/epics/completed/dismiss:
