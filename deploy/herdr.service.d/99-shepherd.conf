# Installed by deploy/provision.ts and deploy/update.sh as
# ~/.config/systemd/user/herdr.service.d/99-shepherd.conf (#3128). A DROP-IN, not an edit of
# herdr.service: changing that unit's bytes makes update.sh `try-restart herdr`, which ends every live
# session, while a drop-in change only needs `daemon-reload`. Named `99-` so it sorts after operator
# drop-ins (e.g. `20-resource-guardrails.conf`) and its values win.
[Service]
# Never below herdr.service's own value: #2029 took the daemon out at 2500 with `pthread_create: EAGAIN`.
TasksMax=16384
# The systemd default (stop) ends the whole unit — and every session — on a single OOM kill of any
# process in it. Agent workloads now run in shepherd_agents.slice, but a pane shell can still be hit.
OOMPolicy=continue
# Agents run in their own scopes, so systemd no longer kills them with this unit. Keep the old
# contract — pane processes die with the server, on stop, crash and restart alike — by stopping the
# agents slice. Synchronous (no --no-block): a restarted herdr must not race a pending slice stop
# against the scopes of freshly spawned agents. `-`: herdr's stop never fails over it.
ExecStopPost=-systemctl --user stop shepherd_agents.slice
