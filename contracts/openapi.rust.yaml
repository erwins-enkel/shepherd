    ApnsRegistration:
      type: object
      additionalProperties: false
      required:
        - token
        - environment
      properties:
        token:
          type: string
          description: The device token from registerForRemoteNotifications, hex-encoded.
        environment:
          type: string
          enum:
            - sandbox
            - production
          description: Which APNs host the token belongs to (development builds use sandbox).
        locale:
          type: string
          description: Notification language for this device (en or de; anything else reads as en).
        coveredInstances:
          type: array
          maxItems: 64
          items:
            type: string
            minLength: 1
            maxLength: 64
          description: Instance IDs (GET /api/instance there) of the other servers this device is registered with for push itself. This server skips the notifications it would relay for those servers' sessions, since the device hears them from the server directly. Send it, and relayRemote, only to a server whose GET /api/instance reports pushRelay.
        relayRemote:
          type: boolean
          default: true
          description: Whether this server relays notifications for the sessions of its connected machines to this device. Defaults to true once either relay field is sent; a registration with neither field gets no relayed notifications, as before.
    ApnsRegistrationResult:
      type: object
      additionalProperties: true
      required:
        - endpoint
      properties:
        endpoint:
          type: string
          description: The device's push endpoint; the key for /api/push/prefs and /api/push/unsubscribe.
    ApnsField:
      type: string
      enum:
        - key
        - keyId
        - teamId
        - topic
    ApnsKeyError:
      type: string
      enum:
        - unreadable
        - invalid
        - not_p256
      description: Why a configured key cannot sign — a missing env file, not a private key, or not the EC P-256 key APNs requires.
    ApnsFailure:
      type: object
      additionalProperties: true
      required:
        - status
        - reason
        - at
      properties:
        status:
          type: integer
          description: HTTP status APNs answered (0 when the connection itself failed).
        reason:
          type: string
          nullable: true
          description: APNs' reason, e.g. InvalidProviderToken or BadDeviceToken.
        at:
          type: integer
    ApnsStatus:
      type: object
      additionalProperties: true
      description: Native iOS push configuration. Never carries the key, not even part of it.
      required:
        - state
        - hasKey
        - keyId
        - teamId
        - topic
        - keySavedAt
        - env
        - keyError
        - lastError
        - lastDeliveredAt
      properties:
        state:
          type: string
          enum:
            - unconfigured
            - configured
            - error
        hasKey:
          type: boolean
        keyId:
          type: string
          nullable: true
        teamId:
          type: string
          nullable: true
        topic:
          type: string
        keySavedAt:
          type: integer
          nullable: true
          description: When the stored key was saved; null when none is stored or the environment supplies it.
        env:
          type: object
          additionalProperties: false
          description: Fields set by SHEPHERD_APNS_* — they override the stored value and cannot be edited.
          required:
            - key
            - keyId
            - teamId
            - topic
          properties:
            key:
              type: boolean
            keyId:
              type: boolean
            teamId:
              type: boolean
            topic:
              type: boolean
        keyError:
          allOf:
            - $ref: "#/components/schemas/ApnsKeyError"
          nullable: true
        lastError:
          allOf:
            - $ref: "#/components/schemas/ApnsFailure"
          nullable: true
        lastDeliveredAt:
          type: integer
          nullable: true
    ApnsConfigRequest:
      type: object
      additionalProperties: true
      description: Fields to store; a field left out keeps its stored value. `key` is the .p8 file's PEM text, never a path.
      properties:
        key:
