version: 2
updates:
  # Bun version updates across all five packages. Bun *security* updates are
  # unsupported by Dependabot and are disabled at the repo level; daily scheduling
  # keeps the version-update (= effective security-fix) channel fresh.
  #
  # `cooldown` is a supply-chain guard: don't open a bump PR until the new version
  # has aged (compromised npm publishes are near-always yanked within hours). It
  # applies to *version* updates only — security-update PRs are exempt — but since
  # bun security updates are disabled here, this does delay the effective security
  # fix by the cooldown window. 3 days is the deliberate balance (matches the
  # `minimumReleaseAge` in each bunfig.toml); bump a package manually if a genuine
  # CVE fix can't wait.
  - package-ecosystem: "bun"
    directories:
      - "/"
      - "/ui"
      - "/extension"
      - "/site"
      - "/docs-site"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # vitest pins its own packages as *exact* peers of each other
      # (`vitest@5.0.0` peers `@vitest/browser-playwright: 5.0.0`, and back), so
      # the family is only ever installable as a set. Ungrouped, a major landed as
      # one PR per package — each individually un-mergeable, and each red or (worse)
      # green-but-inert. This group is listed first so it wins the match, and it
      # covers majors, which the two blanket groups below deliberately do not.
      vitest:
        patterns: ["vitest", "@vitest/*", "vitest-browser-svelte"]
        update-types: ["major", "minor", "patch"]
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  # The Rust CLI (cli/). Same cooldown rationale as the bun block above.
  - package-ecosystem: "cargo"
    directory: "/cli"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # progenitor's generator, its runtime client and typify are released in lockstep and the
      # generated code must match the runtime, so they only ever move as a set — majors included
      # (same lesson as the vitest group, #2260). Listed first so it wins the match.
      progenitor:
        patterns: ["progenitor", "progenitor-client", "typify*"]
        update-types: ["major", "minor", "patch"]
      # build.rs hands a syn::File to prettyplease::unparse, and each prettyplease line only accepts
      # its own syn major (0.2 → syn 2, 0.3 → syn 3), so a lone bump of either fails the build
      # (#2503/#2505). Majors included, same as above.
      syn:
        patterns: ["syn", "prettyplease"]
        update-types: ["major", "minor", "patch"]
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
