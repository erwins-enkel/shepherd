        "200":
          description: PR opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id, or no forge for this repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: No commits to merge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The forge failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/git/merge:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: mergePullRequest
      description: Merges the open PR. Answers the bare PR status — no `kind`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergePrBody"
      responses:
        "200":
          description: Merged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id, or no forge for this repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: No open PR (code pr_already_merged/pr_already_closed/pr_not_found), a merge conflict, a busy base checkout, or missing/stale takeover confirmation (code merge_confirm_required/merge_confirm_stale).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The forge failed, or the host only enqueued the merge (see `code`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
