            - string
            - "null"
        sandboxIdleRegressed:
          type: boolean
        sandboxDowngradeTarget:
          type:
            - string
            - "null"
    CodexUpdateStatus:
      type: object
      additionalProperties: true
      required:
        - current
        - latest
        - updateAvailable
        - notes
        - checkedAt
      properties:
        current:
          type:
            - string
            - "null"
        latest:
          type:
            - string
            - "null"
        updateAvailable:
          type: boolean
        notes:
          type:
            - string
            - "null"
        checkedAt:
          type: integer
        error:
          type: string
    CodexUpdateResult:
      type: object
      additionalProperties: true
      required:
        - ok
        - from
        - to
      properties:
        ok:
          type: boolean
        from:
          type:
            - string
            - "null"
        to:
          type:
            - string
            - "null"
        error:
          type: string
        onPathBinary:
          type:
            - string
            - "null"
    CodexReleaseNotesResult:
