                $ref: "#/components/schemas/BrowseListing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown or archived session, or a path that is not a directory under the root.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/worktree:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: query
        required: false
        description: Directory relative to the worktree root; omitted lists the root.
        schema:
          type: string
    get:
      operationId: getSessionWorktree
      description: Read-only worktree listing. `.git` is hidden; symlinks out of the root are marked.
      responses:
        "200":
          description: One directory of the worktree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowseListing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown or archived session, or a path that is not a directory under the root.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/git:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getSessionGit
      description: PR and forge state. 404 covers both an unknown session and a repo with no forge.
      responses:
        "200":
          description: Git state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id, or no forge for this repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The forge failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/git/pr:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: openPullRequest
      description: Opens a PR for the session branch. Answers the bare PR status — no `kind`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenPrBody"
      responses:
        "200":
          description: PR opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id, or no forge for this repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: No commits to merge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The forge failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/git/merge:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: mergePullRequest
      description: Merges the open PR. Answers the bare PR status — no `kind`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergePrBody"
      responses:
        "200":
          description: Merged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id, or no forge for this repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: No open PR, a merge conflict, a busy base checkout, or missing/stale takeover confirmation (code merge_confirm_required/merge_confirm_stale).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The forge failed, or the host only enqueued the merge (see `code`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/git/ready:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: setPullRequestReady
      description: Marks the PR ready for review. Idempotent when it already is.
      responses:
        "200":
          description: Git state after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitState"
        "400":
          description: This forge cannot change draft state (no `markReady`, e.g. LocalForge).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id, or no forge for this repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "No open PR, or draft mode still awaiting sign-off (`code: draft_awaiting_signoff`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The forge failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/git/draft:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: setPullRequestDraft
      description: Converts the PR back to a draft. Idempotent when it already is one.
      responses:
        "200":
          description: Git state after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitState"
        "400":
          description: This forge cannot change draft state (no `convertToDraft`, e.g. LocalForge).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id, or no forge for this repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: No open PR.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The forge failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/git/close:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: closePullRequest
      responses:
        "200":
          description: Git state after the close.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitState"
        "400":
          description: This forge cannot close PRs (no `closePr`, e.g. LocalForge).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id, or no forge for this repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: No open PR.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The forge failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/git/reviewers:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPullRequestReviewers
      description: Candidate reviewers for the open PR. GitHub only.
      responses:
        "200":
          description: Reviewer options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrReviewerOptions"
        "400":
          description: "This forge cannot request reviews (`code: review_request_unsupported`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCodeError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id, or no forge for this repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "No open PR to request a review on (`code: review_request_stale`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCodeError"
        "502":
          description: "The forge failed (`code: review_request_failed`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCodeError"
  /api/sessions/{id}/git/request-review:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: requestPullRequestReview
      description: Requests a human review. GitHub only; an already-requested reviewer is a no-op success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequestBody"
      responses:
        "200":
          description: Requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewRequestAck"
        "400":
          description: Unsupported forge, or an invalid body/reviewer (`code`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCodeError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "The host forbids this review request (`code: review_request_forbidden`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCodeError"
        "404":
          description: Unknown id, or no forge for this repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The PR is stale or still a draft (`code`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCodeError"
        "422":
          description: "The host rejects the reviewer login (`code: review_request_invalid_reviewer`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCodeError"
        "502":
          description: "The forge failed (`code: review_request_failed`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCodeError"
  /api/working-blocked:
    get:
      operationId: getWorkingBlocked
      description: Which blocked-looking sessions are in fact still working.
      responses:
        "200":
          description: Session id -> working flag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkingBlockedMap"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/holds:
    get:
      operationId: getHolds
      responses:
        "200":
          description: Session id -> hold reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoldMap"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/blocks:
    get:
      operationId: getBlocks
      responses:
        "200":
          description: Session id -> block reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockMap"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/usage/limits:
    get:
      operationId: getUsageLimits
      responses:
        "200":
          description: The rate-limit windows plus their projections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageLimitsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sessions/{id}/resume:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: resumeSession
      description: Resume a finished session. Adopts a live pane unless `force`, which tears the husk down and respawns. 409 covers every "cannot resume" case, including an unknown id.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeRequest"
      responses:
        "200":
          description: The resumed session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Cannot resume — unknown id, archived, no conversation to resume, or refused by the auto gate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/rename:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: renameSession
      description: Rename the session. The git branch moves too unless an open PR pins it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameRequest"
      responses:
        "200":
          description: The renamed session and whether its branch moved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenameResult"
        "400":
          description: Body is not {name -> non-blank string}.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: error is "name_taken" — the target branch name is already in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/amendments:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: amendSession
      description: Record an operator scope amendment beside the original task. Persisted first, steered second, so `steered false` never means "not recorded".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmendmentRequest"
      responses:
        "201":
          description: The recorded amendment and whether it reached the agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmendmentCreated"
        "400":
          description: Missing, blank or over-long text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/ready:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: setSessionReady
      description: Set or clear the manual ready-to-merge flag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadyRequest"
      responses:
        "200":
          description: Flag applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: Body is not {ready -> boolean}.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/relaunch:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: relaunchSession
      description: Spawn a fresh replacement carrying the original's prompt and settings, then decommission the original. Destructive — the original's worktree goes away. Send no body for a plain relaunch; overrides are the composer's surface and are not declared here.
      responses:
        "201":
          description: The replacement, and whether the original was torn down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelaunchResult"
        "400":
          description: The body carried an unknown or invalid override key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already archived, or a relaunch of this id is in flight (code "in_progress").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The replacement could not be spawned, or a same-repo relaunch could not re-resolve the linked issue (code "issue_unresolved"). The original is left intact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/recap/regenerate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: regenerateRecap
      description: Force a fresh recap for this session. Accepted, not completed — the recap arrives later as a session:recap frame.
      responses:
        "202":
          description: Accepted, with what the regenerate actually did.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecapRegenerateResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/recaps:
    get:
      operationId: listRecaps
      description: Bootstrap snapshot of every recap the server has cached.
      responses:
        "200":
          description: Session id -> recap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecapMap"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/git:
    get:
      operationId: gitStates
      description: Every session's cached PR state in one read. The herd classifier's bootstrap; session:git keeps it current afterwards.
      responses:
        "200":
          description: Session id to PR state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitStateMap"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/activity:
    get:
      operationId: activityStates
      description: Every session's transcript heartbeat in one read. Bootstraps the row heartbeat strip; session:activity keeps it current.
      responses:
        "200":
          description: Session id to heartbeat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityMap"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/claude-alive:
    get:
      operationId: claudeAliveStates
      description: Every session's coding-CLI liveness in one read. session:claude-alive re-emits on flips only, so a client that reconnects mid-flip needs this.
      responses:
        "200":
          description: Session id to liveness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaudeAliveMap"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/reviews:
    get:
      operationId: listReviews
      description: Every session's latest critic verdict. Bootstraps the critic badge and the needsRework stage.
      responses:
        "200":
          description: Session id to verdict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewVerdictMap"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/reviews/inflight:
    get:
      operationId: listReviewsInflight
      description: The critic runs in flight right now, with the CLI/model/effort each is using. Reconstructs the reviewerRunning stage after a reload.
      responses:
        "200":
          description: One row per in-flight run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewerInflightList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sessions/{id}/review-pr:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: reviewPr
      description: Force a critic review of this session's PR. Answers 202 with what it did — the run itself is asynchronous and lands as session:reviewing then session:review.
      responses:
        "202":
          description: Accepted. `status` says whether a run actually started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrReviewResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 'Two bodies, same status: error is "not found" for an unknown id, or "no forge for this repo" when the repo has no forge configured.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The forge lookup threw while resolving the PR state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/plan-gates:
    get:
      operationId: listPlanGates
      description: Every session's plan-gate verdict in one read. Bootstraps the badge, the plan tab and the unanswered-question signal.
      responses:
        "200":
          description: Session id to gate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanGateMap"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/plan-gates/inflight:
    get:
      operationId: listPlanGatesInflight
      description: The plan reviews running right now, each with its reviewer environment.
      responses:
        "200":
          description: One row per in-flight review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanGateInflightList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sessions/{id}/go:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: releasePlanGate
      description: "Release an approved plan gate and start execution. Succeeds only when the session is in the planning phase, its gate is approved, and the steer reaches the live pane. There is NO 404: an unknown id answers the same 409 as a gate that is not releasable."
      responses:
        "200":
          description: Execution started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: error is "plan not approved or not in planning phase". Also the answer for an unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/answer-plan-questions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: answerPlanQuestions
      description: Deliver the operator's answers to the planning agent and record which questions are answered. Answers are resolved fail-closed, and only RESOLVED answers record a key — a dropped answer never marks its question done.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerPlanQuestionsRequest"
      responses:
        "200":
          description: Recorded. `delivered` says whether the steer reached the live pane.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerPlanQuestionsResult"
        "400":
          description: 'Two bodies: "body must be {answers: RawAnswer[]}" for a malformed payload, and "no answers resolved" when every answer was dropped.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 'Two bodies: "not in planning phase", and "no plan questions" when the gate carries no question-form block.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/review-plan:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: reviewPlan
      description: Force an adversarial plan review. 202 — the review itself is asynchronous and lands as session:plangate-reviewing then session:plangate.
      responses:
        "202":
          description: Accepted. `status` says what actually happened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanReviewResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/quota/resume:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: resumePlanQuota
      description: Reset a stalled plan's round budget and re-deliver its findings to the planning agent. 202 even when nothing was stalled.
      responses:
        "202":
          description: Accepted. `status` distinguishes resumed, unreachable and not-stalled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanQuotaResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 'Two bodies, same status: "not found" for an unknown id, and "no forge for this repo" on the critic branch of this shared route.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The critic branch's forge lookup threw.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/quota/dismiss:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: dismissPlanQuota
      description: Reset a stalled plan's round budget WITHOUT re-delivering findings — the operator is taking it over.
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanQuotaResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/held:
    get:
      operationId: listHeld
      description: Held inputs, with capacity holds last and FIFO within each group.
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeldQueueList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/held/{id}/spawn:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: spawnHeld
      description: Release a held task immediately. A successful spawn removes the entry; a failed spawn leaves it held. Send no body or an optional provider override.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeldSpawnRequest"
      responses:
        "201":
          description: Session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Body is not an object, contains an unknown key, or has an invalid agentProvider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Spawn refused by sandbox policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: First-run pending, herdr_restart_required, spawn_canceled, worktree occupied, or agent name already taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Base ref does not resolve to a commit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Creation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/held/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateHeld
      description: Replace the full create input while retaining queue membership. Requires application/json. The shared checkOrigin guard does not cover PATCH.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeldQueueEntry"
        "400":
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: discardHeld
      description: "Idempotent discard: unknown ids also answer {ok: true}, never 404. Re-read the list after success."
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/up-next/refresh:
    post:
      operationId: refreshUpNext
      description: Fire-and-forget refresh; the snapshot arrives through upnext:snapshot.
      responses:
        "202":
          description: Accepted; computation runs in the background.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Up Next dependency is unwired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/up-next/start:
    post:
      operationId: startUpNext
      description: "Status encodes the outcome over one body shape: 201 when at least one session was created, 200 when everything was held instead, 502 when every item errored. A client must read all three arrays regardless of status."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpNextStartRequest"
      responses:
        "200":
          description: No sessions created; at least one item held (errors may coexist).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpNextStartResult"
        "201":
          description: At least one session created (held items and errors may coexist).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpNextStartResult"
        "400":
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: First-run setup is pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Every item errored; still the same result body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpNextStartResult"
  /api/halt:
    post:
      operationId: haltHerd
      description: "Interrupt every live working agent. A herdr that cannot be reached is a genuine 500, by design — a silent {halted: 0} would read as 'nothing was running'. Undeclared, like every other 5xx."
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HaltResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/retry:
    post:
      operationId: retryHalted
      description: total is the number of ids REQUESTED, not the number screened — unknown ids and terminal sessions are dropped silently and still counted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryRequest"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryResult"
        "400":
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/stranded:
    get:
      operationId: listStranded
      description: Currently stranded session ids, for client bootstrap.
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrandedSessionIds"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/revive-stranded:
    post:
      operationId: reviveStranded
      description: Force-resume every currently stranded session; the server computes the target set.
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviveResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sessions/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: restoreSession
      description: Restore an archived session and its conversation.
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Conflict code: in_progress, not_archived, cannot_restore, branch_gone, branch_in_use, or spawn_refused."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreConflict"
  /api/sessions/{id}/usage:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: sessionUsage
      description: Resolve per-session token usage, distinguishing missing data from measured zero.
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUsage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/broadcast:
    post:
      operationId: broadcast
      description: Send a steer to selected sessions, classifying delivered, queued, offline and skipped targets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcastRequest"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastResult"
        "400":
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/uploads:
    post:
      operationId: uploadFile
      description: Stage a file before session creation, or attach to an existing session.
      parameters:
        - name: session
          in: query
          required: false
          schema:
            type: string
          description: Optional existing session. The composer omits this parameter.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: The absolute staged path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          description: error is "missing file field".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: error is "unknown session"; only reachable with the optional session query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: error is "file too large".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/issues:
    get:
      operationId: listIssues
      description: Open issues for one repo, with the authenticated forge user. Never 5xx — a failed listing is a 200 carrying `error`.
      parameters:
        - name: repo
          in: query
          required: true
          schema:
            type: string
          description: Absolute repo path; must resolve under the server's repo root.
      responses:
        "200":
          description: The listing, possibly empty and possibly carrying an error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueListing"
        "400":
          description: error is "invalid repo" — the path did not resolve under the repo root.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/commands:
    get:
      operationId: listCommands
      description: Installed slash commands and skills for one repo and engine. An absent or unresolvable `repo` is NOT an error — the route then answers user-scope commands only.
      parameters:
        - name: repo
          in: query
          required: false
          schema:
            type: string
        - name: provider
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AgentProvider"
          description: Defaults to claude when absent.
      responses:
        "200":
          description: The commands, possibly empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandListing"
        "400":
          description: error is "invalid provider".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/epics:
    get:
      operationId: listEpics
      description: Epics and their sub-issue numbers for one repo. Feeds the issue picker's "hide sub-issues" filter.
      parameters:
        - name: repo
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The epics, possibly empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpicListing"
        "400":
          description: error is "invalid repo".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/branches:
    get:
      operationId: listBranches
      description: Local branches, current checkout and the repo default branch.
      parameters:
        - name: repo
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Branches, including an empty list for a repo with no commits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchListing"
        "400":
          description: error is "invalid repo".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/branch-status:
    get:
      operationId: getBranchStatus
      description: Performs a bounded real git fetch and writes the origin tracking ref. The server caches results for ten seconds; clients debounce changes by 300 ms and discard stale replies.
      parameters:
        - name: repo
          in: query
          required: true
          schema:
            type: string
        - name: branch
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Local existence and upstream divergence, even when no remote exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchStatus"
        "400":
          description: error is "invalid repo" or "invalid branch".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/repos/init-empty-commit:
    post:
      operationId: initEmptyCommit
      description: Create the initial empty commit, or return the branch if it already resolves.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitEmptyCommitRequest"
      responses:
        "200":
          description: The repaired branch. Invalidates the server's branch-status cache.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitEmptyCommitResponse"
        "400":
          description: error is "invalid repo".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Invalid branch or git failed to create the initial commit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/shape:
    post:
      operationId: shapeTask
      description: Read the repo and rough prompt into a draft and clarifying questions, before creating a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShapeRequest"
      responses:
        "200":
          description: Draft brief and the plan stream's question form; questions may be empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShapeRound"
        "400":
          description: Malformed body or invalid repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: The shaping agent failed with a stable error slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShapeFailure"
        "503":
          description: The server has no shaper configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShapeUnavailable"
  /api/shape/brief:
    post:
      operationId: shapeBrief
      description: Resolve answers against the round and compose a full replacement prompt, without spawning a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShapeBriefRequest"
      responses:
        "200":
          description: The complete task brief.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShapeBriefResponse"
        "400":
          description: error is "invalid round".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/spawns/{id}/cancel:
    post:
      operationId: cancelSpawn
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancellation requested, or false when the agent started first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpawnCancelResponse"
        "400":
          description: Invalid spawn id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such spawn in flight.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
x-shepherd-events:
  description: 'WebSocket /events. Same auth gate as HTTP (send Authorization on the upgrade). Every frame is an EventEnvelope: {"event": string, "data": object}. Client may send {"type":"presence","active":boolean}; the server never replies to it.'
  envelope:
    $ref: "#/components/schemas/EventEnvelope"
  session:new:
    description: A session row was created (also on relaunch and terminal create).
    schema:
      $ref: "#/components/schemas/Session"
  session:status:
    description: Status changed. May carry the whole Session or only id+status.
    schema:
      $ref: "#/components/schemas/SessionStatusEvent"
  session:renamed:
    schema:
      $ref: "#/components/schemas/SessionRenamedEvent"
  session:archived:
    schema:
      $ref: "#/components/schemas/SessionArchivedEvent"
  session:block:
    description: Agent is waiting on the operator (block != null) or unblocked (null).
    schema:
      $ref: "#/components/schemas/SessionBlockEvent"
  session:ready:
    schema:
      $ref: "#/components/schemas/SessionReadyEvent"
  automerge:status:
    schema:
      $ref: "#/components/schemas/AutoMergeStatus"
  usage:limits:
    schema:
      $ref: "#/components/schemas/UsageLimits"
  session:git:
    description: PR/forge state for one session changed (poller push, or a PR action).
    schema:
      $ref: "#/components/schemas/SessionGitEvent"
  session:activity:
    description: The agent transcript heartbeat moved.
    schema:
      $ref: "#/components/schemas/SessionActivityEvent"
  held:changed:
    description: The number of tasks held behind the usage gate moved. The client re-reads GET /api/holds; the frame carries only the count.
    schema:
      $ref: "#/components/schemas/HeldChangedEvent"
  session:working-blocked:
    description: A session the poller called blocked is (or is no longer) still producing output. The client re-reads GET /api/working-blocked.
    schema:
      $ref: "#/components/schemas/SessionWorkingBlockedEvent"
  session:recap:
    description: A session's recap was created, regenerated or changed state. Carries the whole recap, so no re-read is needed.
    schema:
      $ref: "#/components/schemas/SessionRecapEvent"
  session:amendments:
    description: A session's amendment list changed. Always the FULL current list, so an empty array is a genuine all-clear.
    schema:
      $ref: "#/components/schemas/SessionAmendmentsEvent"
  session:review:
    description: A critic verdict landed or was cleared. A null review also ends the in-flight run for that session.
    schema:
      $ref: "#/components/schemas/SessionReviewEvent"
  session:reviewing:
    description: A critic run started or ended. `env` rides the start edge only.
    schema:
      $ref: "#/components/schemas/SessionReviewingEvent"
  session:critic-activity:
    description: One line of critic progress. Cleared on both edges of session:reviewing.
    schema:
      $ref: "#/components/schemas/SessionCriticActivityEvent"
  session:claude-alive:
    description: A session's coding-CLI liveness flipped. Flips only — bootstrap from GET /api/claude-alive.
    schema:
      $ref: "#/components/schemas/SessionClaudeAliveEvent"
  session:plangate:
    description: Polymorphic — a fresh verdict carries `gate`, a phase flip carries `planPhase`. Handle each key independently.
    schema:
      $ref: "#/components/schemas/SessionPlanGateEvent"
  session:plangate-reviewing:
    description: A plan review started or ended. `env` rides the start edge only.
    schema:
      $ref: "#/components/schemas/SessionPlanGateReviewingEvent"
  session:plangate-activity:
    description: One line of plan-reviewer progress. Cleared on both edges of session:plangate-reviewing.
    schema:
      $ref: "#/components/schemas/SessionPlanGateActivityEvent"
  upnext:snapshot:
    description: A freshly computed Up Next queue. The ONLY delivery path for the snapshot — see UpNextSnapshot.
    schema:
      $ref: "#/components/schemas/UpNextSnapshotEvent"
  halt:done:
    description: A herd halt finished. Broadcast to every client, so a client that did not issue it still learns.
    schema:
      $ref: "#/components/schemas/HaltDoneEvent"
  session:halt:
    description: "One session's halt flag moved. haltReason: null means it cleared."
    schema:
      $ref: "#/components/schemas/SessionHaltEvent"
  session:hold:
    description: Why one session is parked, or null when it is not. Despite the name this is UNRELATED to the held-task queue.
    schema:
      $ref: "#/components/schemas/SessionHoldEvent"
  app:sessions-stranded:
    description: The stranded set GREW. Fires on growth only, so the count is a prompt to re-read GET /api/stranded, not a running total.
    schema:
      $ref: "#/components/schemas/SessionsStrandedEvent"
  app:auto-revived:
    description: The poller revived stranded sessions by itself. Totals for the current restart episode.
    schema:
      $ref: "#/components/schemas/AutoRevivedEvent"
  spawn:progress:
    description: Current phase and completed phase timings for a correlated session create.
    schema:
      $ref: "#/components/schemas/SpawnProgressEvent"
x-shepherd-pty:
  description: WebSocket /pty/{id}?cols=&rows=. Same auth gate and origin check as HTTP; the bearer goes on the upgrade request. An unknown session id is answered 404 before the upgrade. cols/rows set the attach size so the first paint matches the client's viewport. On attach the server replays the pane's scrollback, so a client must clear its own buffer on every (re)attach rather than appending. Server→client frames are raw terminal bytes (binary or text). Client→server text frames are keystrokes, except frames starting with resizePrefix which carry "<cols>:<rows>\n". One owner per terminal id; a new attach closes the previous socket with closeCodes.superseded and the loser must NOT reconnect (both would bump each other forever). closeCodes.gone means the session no longer has a live agent and no reattach can succeed. Any other close is transient; clients retry with backoff.
  path: /pty/{id}
  query:
    - cols
    - rows
  resizePrefix: "\0resize:"
  closeCodes:
    superseded: 4000
    gone: 4001
