    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: releasePlanGate
      description: "Release an approved plan gate and start execution. Succeeds only when the session is in the planning phase, its gate is approved, and the steer reaches the live pane. There is NO 404: an unknown id answers the same 409 as a gate that is not releasable."
      responses:
        "200":
          description: Execution started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: error is "plan not approved or not in planning phase". Also the answer for an unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/answer-plan-questions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: answerPlanQuestions
      description: Deliver the operator's answers to the planning agent and record which questions are answered. Answers are resolved fail-closed, and only RESOLVED answers record a key — a dropped answer never marks its question done.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerPlanQuestionsRequest"
      responses:
        "200":
          description: Recorded. `delivered` says whether the steer reached the live pane.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerPlanQuestionsResult"
        "400":
          description: 'Two bodies: "body must be {answers: RawAnswer[]}" for a malformed payload, and "no answers resolved" when every answer was dropped.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 'Two bodies: "not in planning phase", and "no plan questions" when the gate carries no question-form block.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
