          description: Creation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/held/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateHeld
      description: Replace the full create input while retaining queue membership. Requires application/json and passes the shared origin policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeldQueueEntry"
        "400":
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Origin not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: discardHeld
      description: "Idempotent discard: unknown ids also answer {ok: true}, never 404. Re-read the list after success."
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/up-next:
    get:
      operationId: peekUpNext
      description: Read the cached snapshot with peek=1 without computing recommendations. Without peek, the server also schedules a recomputation.
      parameters:
        - in: query
          name: peek
          required: true
          schema:
            type: string
            enum:
              - "1"
      responses:
        "200":
          description: Cached snapshot, or JSON null when nothing is cached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpNextCachedSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/up-next/refresh:
    post:
      operationId: refreshUpNext
      description: Fire-and-forget refresh; the snapshot arrives through upnext:snapshot.
      responses:
        "202":
          description: Accepted; computation runs in the background.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Up Next dependency is unwired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/up-next/start:
    post:
      operationId: startUpNext
      description: "Status encodes the outcome over one body shape: 201 when at least one session was created, 200 when everything was held instead, 502 when every item errored. A client must read all three arrays regardless of status."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpNextStartRequest"
      responses:
        "200":
          description: No sessions created; at least one item held (errors may coexist).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpNextStartResult"
        "201":
          description: At least one session created (held items and errors may coexist).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpNextStartResult"
        "400":
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartUpNextError"
        "401":
          description: Missing or invalid credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartUpNextError"
        "409":
          description: First-run setup is pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartUpNextError"
        "502":
          description: Every item errored; still the same result body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartUpNextError"
  /api/halt:
    post:
      operationId: haltHerd
      description: "Interrupt every live working agent. A herdr that cannot be reached is a genuine 500, by design — a silent {halted: 0} would read as 'nothing was running'. Undeclared, like every other 5xx."
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HaltResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/retry:
    post:
      operationId: retryHalted
      description: total is the number of ids REQUESTED, not the number screened — unknown ids and terminal sessions are dropped silently and still counted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryRequest"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryResult"
        "400":
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/stranded:
    get:
      operationId: listStranded
      description: Currently stranded session ids, for client bootstrap.
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrandedSessionIds"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/revive-stranded:
    post:
      operationId: reviveStranded
      description: Force-resume every currently stranded session; the server computes the target set.
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviveResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sessions/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: restoreSession
      description: Restore an archived session and its conversation.
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Missing or invalid credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreSessionError"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreSessionError"
        "409":
          description: "Conflict code: in_progress, not_archived, cannot_restore, branch_gone, branch_in_use, or spawn_refused."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreSessionError"
  /api/sessions/{id}/usage:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: sessionUsage
      description: Resolve per-session token usage, distinguishing missing data from measured zero.
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUsage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/broadcast:
    post:
      operationId: broadcast
      description: Send a steer to selected sessions, classifying delivered, queued, offline and skipped targets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcastRequest"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastResult"
        "400":
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/backlog:
    get:
      operationId: getBacklog
      description: "The backlog overview: every repo under the repo root, with open issue and PR counts."
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacklogPayload"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/issues:
    get:
      operationId: listIssues
      description: Open issues for one repo, with the authenticated forge user. Never 5xx — a failed listing is a 200 carrying `error`.
      parameters:
        - name: repo
          in: query
          required: true
          schema:
            type: string
          description: Absolute repo path; must resolve under the server's repo root.
      responses:
        "200":
          description: The listing, possibly empty and possibly carrying an error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueListing"
        "400":
          description: error is "invalid repo" — the path did not resolve under the repo root.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/commands:
    get:
      operationId: listCommands
      description: Installed slash commands and skills for one repo and engine. An absent or unresolvable `repo` is NOT an error — the route then answers user-scope commands only.
      parameters:
        - name: repo
          in: query
          required: false
          schema:
            type: string
        - name: provider
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AgentProvider"
          description: Defaults to claude when absent.
      responses:
        "200":
          description: The commands, possibly empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandListing"
        "400":
          description: error is "invalid provider".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/epics:
    get:
      operationId: listEpics
      description: Epics and their sub-issue numbers for one repo. Feeds the issue picker's "hide sub-issues" filter.
      parameters:
        - name: repo
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The epics, possibly empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpicListing"
        "400":
          description: error is "invalid repo".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/epic:
    get:
      operationId: getEpic
      description: Assemble one epic. Uses the repo's stored run when it is for this parent, else the idle auto default.
      parameters:
        - name: repo
          in: query
          required: true
          schema:
            type: string
        - name: parent
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The epic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Epic"
        "400":
          description: error is "invalid repo" or "parent must be a positive integer".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 'error is "not found": the parent issue could not be read.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: error is "drain unavailable".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: patchEpicRun
      description: Patch the epic's run settings, persist them, and answer the re-assembled epic. A patch without status edits the settings where they live — the repo's run when this epic holds it, its queue row when queued, else its remembered settings — and never supersedes another epic. status running starts this epic (superseding a run for another parent); any status change kicks the drain at once. status idle or paused for an epic that does not lead, while another epic runs or is paused, is refused with 409. A queued epic given a status leaves the queue first.
      parameters:
        - name: repo
          in: query
          required: true
          schema:
            type: string
        - name: parent
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EpicRunPatch"
      responses:
        "200":
          description: The re-assembled epic, or {ok:true} when it can no longer be assembled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpicUpdateResult"
        "400":
          description: error is "invalid repo", "parent must be a positive integer", "invalid epic run patch", or a model the Codex ChatGPT login cannot run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: 'error is "another epic leads": status idle or paused for an epic that does not lead while another one runs or is paused.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: error is "drain unavailable".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/epic/queue:
    post:
      operationId: queueEpic
      description: Queue this epic behind the repo's leading (running or paused) epic, at the tail, with its remembered settings (else the defaults). Queueing an already queued epic keeps its place. The queue head starts on its own, with its stored settings, once the leader completes or is stopped.
      parameters:
        - name: repo
          in: query
          required: true
          schema:
            type: string
        - name: parent
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The re-assembled epic, or {ok:true} when it can no longer be assembled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpicUpdateResult"
        "400":
          description: error is "invalid repo" or "parent must be a positive integer".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: error is "no leading epic" or "epic already leads".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: error is "drain unavailable".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: unqueueEpic
      description: Take this epic out of the repo's epic queue (a no-op when it is not queued); its queued settings stay remembered.
      parameters:
        - name: repo
          in: query
          required: true
          schema:
            type: string
        - name: parent
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The re-assembled epic, or {ok:true} when it can no longer be assembled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpicUpdateResult"
        "400":
          description: error is "invalid repo" or "parent must be a positive integer".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: error is "drain unavailable".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: reorderEpicQueue
      description: Put the repo's epic queue in a new order. `order` must name exactly the queued epics, once each; the new head starts next.
      parameters:
        - name: repo
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EpicQueueReorderRequest"
      responses:
        "200":
          description: The queue in its new order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpicQueueReorderResult"
        "400":
          description: error is "invalid repo" or "order must be an array of positive integers".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: error is "queue changed" — order is not the current queue; re-read it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: error is "drain unavailable".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/epic/approve-next:
    post:
      operationId: approveEpicNext
      description: Approve the next attended epic spawn, run one drain tick, and answer the re-assembled epic.
      parameters:
        - name: repo
          in: query
          required: true
          schema:
            type: string
        - name: parent
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The re-assembled epic, or {ok:true} when it can no longer be assembled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpicUpdateResult"
        "400":
          description: error is "invalid repo" or "parent must be a positive integer".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: error is "drain unavailable".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/branches:
    get:
      operationId: listBranches
      description: Local branches, current checkout and the repo default branch.
      parameters:
        - name: repo
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Branches, including an empty list for a repo with no commits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchListing"
        "400":
          description: error is "invalid repo".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/branch-status:
    get:
      operationId: getBranchStatus
      description: Performs a bounded real git fetch and writes the origin tracking ref. The server caches results for ten seconds; clients debounce changes by 300 ms and discard stale replies.
      parameters:
        - name: repo
          in: query
          required: true
          schema:
            type: string
        - name: branch
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Local existence and upstream divergence, even when no remote exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchStatus"
        "400":
          description: error is "invalid repo" or "invalid branch".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/repos/init-empty-commit:
    post:
      operationId: initEmptyCommit
      description: Create the initial empty commit, or return the branch if it already resolves.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitEmptyCommitRequest"
      responses:
        "200":
          description: The repaired branch. Invalidates the server's branch-status cache.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitEmptyCommitResponse"
        "400":
          description: error is "invalid repo".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Invalid branch or git failed to create the initial commit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/shape:
    post:
      operationId: shapeTask
      description: Read the repo and rough prompt into a draft and clarifying questions, before creating a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShapeRequest"
      responses:
        "200":
          description: Draft brief and the plan stream's question form; questions may be empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShapeRound"
        "400":
          description: Malformed body or invalid repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShapeTaskError"
        "401":
          description: Missing or invalid credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShapeTaskError"
        "422":
          description: The shaping agent failed with a stable error slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShapeTaskError"
        "503":
          description: The server has no shaper configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShapeTaskError"
  /api/shape/brief:
    post:
      operationId: shapeBrief
      description: Resolve answers against the round and compose a full replacement prompt, without spawning a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShapeBriefRequest"
      responses:
        "200":
          description: The complete task brief.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShapeBriefResponse"
        "400":
          description: error is "invalid round".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/spawns/{id}/cancel:
    post:
      operationId: cancelSpawn
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancellation requested, or false when the agent started first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpawnCancelResponse"
        "400":
          description: Invalid spawn id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such spawn in flight.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/steers:
    get:
      operationId: listSteers
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposeSteerList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: saveSteers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 40
              items:
                $ref: "#/components/schemas/ComposeSteerInput"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposeSteerList"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sessions/{id}/variant:
    post:
      operationId: startVariant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComposeVariantRequest"
      responses:
        "201":
          description: Parallel variant created; original remains alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposeSessionResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already archived, or code in_progress while another request is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Agent launch failed; replace may return code issue_unresolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
