  responses:
    Unauthorized:
      description: Missing or invalid credential.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
paths:
  /api/health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Server is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/login:
    post:
      operationId: login
      security: []
      description: Password login. Sets the shepherd_session cookie. The native client uses it once to mint an access token, then discards the cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in; Set-Cookie carries the session.
          headers:
            Set-Cookie:
              required: true
              description: "shepherd_session cookie (login: signed session; logout: cleared with Max-Age=0)."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          description: Wrong password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/logout:
    post:
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Session cookie cleared.
          headers:
            Set-Cookie:
              required: true
              description: "shepherd_session cookie (login: signed session; logout: cleared with Max-Age=0)."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/access-tokens:
    get:
      operationId: listAccessTokens
      security:
        - cookieAuth: []
      responses:
        "200":
          description: All tokens (no plaintext).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not an operator session (a bearer token cannot manage tokens).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: mintAccessToken
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessTokenMintRequest"
      responses:
        "201":
          description: Token minted; plaintext shown exactly once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenMinted"
        "400":
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not an operator session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/access-tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: revokeAccessToken
      description: Revokes one token. An operator session may revoke any token; a bearer access token may revoke ITSELF and nothing else, which is how a native client invalidates its own credential on logout. Self-revocation is allowed whatever the token's scope.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Only an operator session may revoke other tokens; a bearer token may revoke itself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown token id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: Operator settings incl. first-run state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: putRepoRoot
      description: Only the repoRoot form is part of this contract; it also resolves the first-run picker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoRootRequest"
      responses:
        "200":
          description: Repo root stored; first run resolved if it was pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoRootResponse"
        "400":
          description: Not an existing directory under the root ceiling.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: patchSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsPatchResult"
        "400":
          description: Handler refusal; see the verified status matrix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sessions:
    get:
      operationId: listSessions
      description: Active (non-archived) sessions, oldest first. No pagination.
      responses:
        "200":
          description: Sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSession
      description: Creates and spawns a session, or answers 200 with a held task when the usage hold trips (force overrides the hold).
      parameters:
        - name: X-Shepherd-Spawn-Id
          in: header
          required: false
          description: Client-chosen correlation id for this create. With a valid one the caller receives live `spawn:progress` frames and may cancel through POST /api/spawns/{id}/cancel; without one the spawn still runs and is still measured. Deliberately a header and not a body field (src/server.ts:2400-2404) — a usage hold persists the BODY, so a spawn id there would be replayed stale when the held task is finally spawned. Header names are case-insensitive; the server compares lowercase.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "200":
          description: Usage hold tripped — queued as a held task instead of spawned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSessionSuccess"
        "201":
          description: Session created and agent spawned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSessionSuccess"
        "400":
          description: Invalid input (see error text).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: First run pending, name taken, worktree occupied, or herdr restart required (see code).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The base branch does not resolve to a ref in the repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Create failed downstream (git or the agent runner).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
