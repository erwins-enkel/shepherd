          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/rename:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: renameSession
      description: Rename the session. The git branch moves too unless an open PR pins it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameRequest"
      responses:
