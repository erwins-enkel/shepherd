  /api/sessions/{id}/review-pr:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: reviewPr
      description: Force a critic review of this session's PR. Answers 202 with what it did — the run itself is asynchronous and lands as session:reviewing then session:review.
      responses:
        "202":
          description: Accepted. `status` says whether a run actually started.
