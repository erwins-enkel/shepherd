          items:
            type: string
    RequirementsDerivation:
      type: object
      additionalProperties: true
      required:
        - status
      description: "What the task's description calls for, as data from the capability vocabulary — never prose; clients put it into words. skipped: no machine is connected, so it cannot change where the task runs, and nothing ran. derived: `requirements` (possibly empty) — what the description calls for, with what each implies (the iOS simulator needs the iOS SDK, which needs Xcode). unclear: the description could mean different things or contradicts itself; `options` holds 2–3 requirement sets (an empty one = nothing special) for the operator to choose from before the task starts. failed: nothing was derived — `cause` is timeout, error (including an answer outside the vocabulary) or unavailable (no helper could run); nothing is guessed."
      properties:
        status:
          anyOf:
            - type: string
              enum:
                - skipped
                - derived
                - unclear
                - failed
            - type: string
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        options:
          type: array
          items:
            type: array
            items:
