name: native-ios

# `ui/messages/*.json` is deliberately NOT in the filter (#2709, as in
# native.yml since #2567): the string catalog's freshness check
# (`bun run check:strings`) is a plain Bun script, so CI's Linux `static` job
# (required via `verify`) runs it on every PR. A PR that changes a mirrored
# key must regenerate the catalog under `native/**`, which starts this
# workflow anyway; any other message edit leaves the iOS build's input
# unchanged. The in-job copy below still catches `native/**` edits to the key
# lists.
#
# Per-platform split: the Mac app, package tests (`native/Tests/**`, never run
# here), Mac-only scripts and docs/markdown are excluded (native.yml covers
# them). Negations must stay last.
#
# One build, no rebuilds: `build-ios-app.sh --for-testing` compiles the app and
# both test bundles once, for arm64 only, and every test step runs them with
# `--without-building`. A PR runs the unit and iPhone UI bundles. The iPad UI
# bundle needs a second simulator boot, so it runs on push to main, or on a PR
# labelled `ci:full-native` (from its next push: a re-run keeps the old labels).
on:
  pull_request:
    branches: [main, "epic/**"]
    paths:
      - "native/**"
      - "contracts/**"
      - "scripts/gen-contract-swift.ts"
      - "test/native-ios-*.test.ts"
      - "test/fixtures/native-ios-*.json"
      - ".github/workflows/native-ios.yml"
      - "!native/Apps/ShepherdMac/**"
      - "!native/Tests/**"
      - "!native/docs/**"
      - "!native/**/*.md"
      - "!native/scripts/*mac*"
      - "!native/scripts/*dmg*"
      - "!native/scripts/dmg-assets/**"
      - "!native/scripts/build-app.sh"
      - "!native/scripts/test-app.sh"
      - "!native/scripts/*update*"
      - "!native/scripts/*appcast*"
      - "!native/scripts/*sign*"
      - "!native/scripts/notarize.sh"
      - "!native/scripts/render-*"
      - "!native/scripts/keychain-secret.sh"
      - "!native/scripts/codesign-mode.sh"
      - "!native/scripts/check-core-results.py"
      - "!native/scripts/select-core-simulator.py"
      - "!native/scripts/test-conservation.ts"
  push:
    branches: [main]
    paths:
      - "native/**"
      - "contracts/**"
      - "scripts/gen-contract-swift.ts"
      - "test/native-ios-*.test.ts"
      - "test/fixtures/native-ios-*.json"
      - ".github/workflows/native-ios.yml"
      - "!native/Apps/ShepherdMac/**"
      - "!native/Tests/**"
      - "!native/docs/**"
      - "!native/**/*.md"
      - "!native/scripts/*mac*"
      - "!native/scripts/*dmg*"
      - "!native/scripts/dmg-assets/**"
      - "!native/scripts/build-app.sh"
      - "!native/scripts/test-app.sh"
      - "!native/scripts/*update*"
      - "!native/scripts/*appcast*"
      - "!native/scripts/*sign*"
      - "!native/scripts/notarize.sh"
      - "!native/scripts/render-*"
      - "!native/scripts/keychain-secret.sh"
      - "!native/scripts/codesign-mode.sh"
      - "!native/scripts/check-core-results.py"
      - "!native/scripts/select-core-simulator.py"
      - "!native/scripts/test-conservation.ts"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FULL_NATIVE: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ci:full-native') }}

jobs:
  ios:
    name: iOS simulator build and isolated tests
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: ./.github/actions/bun-install-retry
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Install Metal toolchain for SwiftTerm
        run: native/scripts/uitest-lock.sh xcodebuild -downloadComponent MetalToolchain
      - name: Report toolchain and check generated resources
        run: |
          set -euo pipefail
          native/scripts/uitest-lock.sh xcodebuild -version
          native/scripts/uitest-lock.sh swift --version
          bun run check:contract-swift
          native/scripts/sync-contract.sh --check
          bun run check:strings
      - name: Build the application and test bundles for the iOS Simulator
        run: native/scripts/uitest-lock.sh native/scripts/build-ios-app.sh Debug --for-testing
      - name: Run isolated hosted unit tests
        run: native/scripts/uitest-lock.sh native/scripts/test-ios-app.sh unit --without-building --result-bundle-path "$RUNNER_TEMP/ios-unit.xcresult"
      - name: Diagnose reconnect failures with Address Sanitizer
        if: failure()
        timeout-minutes: 15
        run: |
          set -euo pipefail
          export SHEPHERD_ISOLATED=1 TEST_RUNNER_SHEPHERD_ISOLATED=1
          cd native/Apps/ShepherdIOS
          ../../scripts/uitest-lock.sh xcodebuild -project ShepherdIOS.xcodeproj -scheme ShepherdIOS -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17' -derivedDataPath .build \
            -parallel-testing-enabled NO -only-testing:ShepherdIOSTests/IOSReconnectTests \
            -enableAddressSanitizer YES -resultBundlePath "$RUNNER_TEMP/ios-reconnect-asan.xcresult" \
            -skipPackagePluginValidation -packageAuthorizationProvider netrc -scmProvider system \
            CODE_SIGNING_ALLOWED=NO test
      - name: Run isolated iPhone UI tests
        run: native/scripts/uitest-lock.sh native/scripts/test-ios-app.sh ui --family iPhone --without-building --result-bundle-path "$RUNNER_TEMP/ios-iphone.xcresult"
      # The runner has 7 GB: booting the iPad beside the still-running iPhone
      # simulator took up to 8 minutes.
      - name: Shut down the iPhone simulator
        if: env.FULL_NATIVE == 'true'
        run: xcrun simctl shutdown all
      - name: Run isolated iPad UI tests
        if: env.FULL_NATIVE == 'true'
        run: native/scripts/uitest-lock.sh native/scripts/test-ios-app.sh ui --family iPad --without-building --result-bundle-path "$RUNNER_TEMP/ios-ipad.xcresult"
      - name: Preserve simulator results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator-results
          path: |
            ${{ runner.temp }}/ios-*.xcresult
            ${{ runner.temp }}/ios-*.xcresult.summary.json
            ${{ runner.temp }}/ios-*.xcresult.tests.json
          if-no-files-found: warn
          retention-days: 7
