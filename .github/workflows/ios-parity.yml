name: iOS parity

# The iOS app lags the PWA, so every PWA change is an iOS question. This workflow
# files that question as a `parity` issue (labels: parity, ios-app, requires-macos):
#
#   - push to main that ADDS a What's-New catalog entry → one issue per new feature.
#     The catalog entry is already mandatory for every user-facing `feat`
#     (scripts/check-feature-catalog.sh), so nobody has to declare anything extra.
#   - weekly (Monday) → one digest issue listing last week's ui/src changes that
#     added no catalog entry (fixes, refinements) for a single iOS review pass.
#
# The one-time backlog catch-up is `bun scripts/ios-parity.ts backfill`, run by hand.
# All logic lives in scripts/ios-parity.ts; issues carry markers, so re-runs and
# manual dispatches never duplicate. Runs on `push`/`schedule` (our own main-branch
# code), never on fork PR content.
on:
  push:
    branches: [main]
    paths:
      - "ui/src/lib/feature-announcements/entries/**"
  schedule:
    - cron: "17 6 * * 1" # Monday 06:17 UTC — the week that just ended
  workflow_dispatch:
    inputs:
      mode:
        description: "digest (last 7 days) or features (needs base/head)"
        required: true
        default: digest
        type: choice
        options: [digest, features]
      base:
        description: "features: base commit"
        required: false
        type: string
      head:
        description: "features: head commit"
        required: false
        type: string
      dry_run:
        description: "Print the issues instead of creating them"
        required: false
        default: false
        type: boolean

# Serialize runs so two pushes can't race the duplicate check.
concurrency:
  group: ios-parity
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  parity:
    # Pinned to GitHub-hosted — public repo, no CI_RUNNER toggle (see ci.yml).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with history (diff ranges + 7-day log)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: File parity issues
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_BASE: ${{ github.event.inputs.base }}
          INPUT_HEAD: ${{ github.event.inputs.head }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          dry=()
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then dry=(--dry-run); fi
          case "$EVENT" in
            push)
              bun scripts/ios-parity.ts features --base "$PUSH_BEFORE" --head "$PUSH_AFTER" ;;
            schedule)
              bun scripts/ios-parity.ts digest ;;
            workflow_dispatch)
              if [ "$INPUT_MODE" = "features" ]; then
                bun scripts/ios-parity.ts features --base "$INPUT_BASE" --head "${INPUT_HEAD:-$PUSH_AFTER}" "${dry[@]}"
              else
                bun scripts/ios-parity.ts digest "${dry[@]}"
              fi ;;
          esac
