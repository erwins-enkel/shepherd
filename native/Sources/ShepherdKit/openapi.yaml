  /api/sessions/{id}/go:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: releasePlanGate
      description: "Release an approved plan gate and start execution. Succeeds only when the session is in the planning phase, its gate is approved, and the steer reaches the live pane. There is NO 404: an unknown id answers the same 409 as a gate that is not releasable. When the session has an execution effort (#3434) Shepherd first switches the running agent to it for this session only; an unconfirmed switch withholds Go (409 with `code`)."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleasePlanGateRequest"
      responses:
        "200":
          description: Execution started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: error is "plan not approved or not in planning phase" (also the answer for an unknown id), or — with `code` busy | unconfirmed — the execution-effort switch was not confirmed and Go was withheld (#3434).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/answer-plan-questions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: answerPlanQuestions
      description: Deliver the operator's answers to the planning agent and record which questions are answered. Answers are resolved fail-closed, and only RESOLVED answers record a key — a dropped answer never marks its question done.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerPlanQuestionsRequest"
      responses:
        "200":
          description: Recorded. `delivered` says whether the steer reached the live pane.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerPlanQuestionsResult"
        "400":
          description: 'Two bodies: "body must be {answers: RawAnswer[]}" for a malformed payload, and "no answers resolved" when every answer was dropped.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 'Two bodies: "not in planning phase", and "no plan questions" when the gate carries no question-form block.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/answer-ask:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: answerAsk
      description: "Answer the open AskUserQuestion dialog (#3165): the answers are resolved against the hooked questions, typed into the session's terminal as key presses, then verified against PostToolUse. Waits up to 10 s for the verification."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerAskRequest"
      responses:
        "200":
          description: The keys were typed; `result` says what landed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerAskResult"
        "400":
          description: Malformed body, or answers that do not fit the questions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: '"ask_not_open" — no open dialog with that toolUseId (answered in the terminal first, or not a Claude session); "ask_in_flight" — an answer is already being typed.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
