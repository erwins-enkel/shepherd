      description: PUT /api/epic body (validateEpicRunPatch in src/validate.ts). Every field optional; absent keeps the stored value. model/effort null or "default" clear back to the provider default; model is checked against agentProvider when both are sent. ignoreUsageCeiling true lifts the repo's usage ceiling for this run and needs the resulting run to be running. landing can change only until the epic started (Epic.landingLocked); sending the current value is a no-op.
