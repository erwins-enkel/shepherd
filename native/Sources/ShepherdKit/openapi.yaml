    VisualBlockUnknown:
      type: object
      additionalProperties: true
      description: "The catch-all member of VisualBlock, and the ONLY reason an unfamiliar block type does not cost the client the whole gate. Same idea as x-shepherd-open-enum for a string enum, one level up: `type` excludes all known discriminators, and `markdown` is the degraded rendering some server-side blocks carry. Clients preserve this member on decode. The native renderer intentionally omits unknown block types, including their markdown, while retaining the surrounding plan or recap body."
      required:
        - type
      properties:
        type:
          type: string
          pattern: ^(?!(?:rich-text|callout|file-tree|diff|code|annotated-code|table|checklist|mermaid|wireframe|api-endpoint|data-model|question-form)$)
        markdown:
          type: string
    VisualBlock:
      description: |-
        The thirteen typed plan/recap blocks (src/visual-blocks.ts:10-107), discriminated on `type`, plus VisualBlockUnknown. Shared by plan gates and recaps.
        **`anyOf`, deliberately not `oneOf`.** swift-openapi-generator renders a `oneOf` as a closed Swift enum: thirteen cases and nothing else, so an unfamiliar `type` matches no member and the decode of the WHOLE PlanGate fails — the opposite of the degradation this description promises, and the failure mode `contracts/README.md`'s open-enum section exists to prevent. An `anyOf` decodes each member independently into optional properties, so the fourteenth matches only unfamiliar types and the gate survives. Malformed known blocks must fail validation rather than slipping through the fallback. This is the same shape `x-shepherd-open-enum` already produces (`anyOf: [{$ref: <Name>Known}, {type: string}]`), one level up. A `discriminator:` would be the other way to get an undocumented case, but nothing in this contract uses one and `scripts/gen-contract-swift.ts` has no handling for it — do not introduce one here.
        Before writing the renderer, run `bun run gen:contract-swift` and READ the generated `Types.swift` for `VisualBlock`: assert against the property names the generator actually produced, never against a guessed `.undocumented` case.
      anyOf:
        - $ref: "#/components/schemas/VisualBlockRichText"
        - $ref: "#/components/schemas/VisualBlockCallout"
        - $ref: "#/components/schemas/VisualBlockFileTree"
        - $ref: "#/components/schemas/VisualBlockDiff"
        - $ref: "#/components/schemas/VisualBlockCode"
        - $ref: "#/components/schemas/VisualBlockAnnotatedCode"
        - $ref: "#/components/schemas/VisualBlockDataModel"
        - $ref: "#/components/schemas/VisualBlockApiEndpoint"
        - $ref: "#/components/schemas/VisualBlockTable"
        - $ref: "#/components/schemas/VisualBlockChecklist"
        - $ref: "#/components/schemas/VisualBlockMermaid"
        - $ref: "#/components/schemas/VisualBlockWireframe"
        - $ref: "#/components/schemas/VisualBlockQuestionForm"
        - $ref: "#/components/schemas/VisualBlockUnknown"
    PlanGate:
