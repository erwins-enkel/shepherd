          type: string
          description: The machine's instance ID, as in each session's `host.instanceId`.
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
    TaskTarget:
      type: object
      additionalProperties: false
      required:
        - instanceId
      description: "The machine a new task runs on, by the instance ID GET /api/remote-instances lists — an override of the automatic choice. Absent while a machine is connected, this instance places the task itself (see POST /api/placement). A named machine must fit: connected, released, the project checked out, the requirements verified by its last report — otherwise it is refused with the reason and nothing is sent. The WHOLE session starts there; nothing starts here. This instance's own ID means here. repoPath then names this instance's checkout only to identify the project (its forge slug); the machine must be connected and have that project checked out, and runs the task in its own checkout. The task is stored before it is sent, and a retry (same Idempotency-Key) only ever goes to the same machine. Attachments (images, staged here) are uploaded to the machine right before the task is sent and travel as its own staged copies; a retry reuses those uploads."
      properties:
        instanceId:
          type: string
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required:
        - repoPath
        - baseBranch
        - prompt
      properties:
        repoPath:
          type: string
        target:
          $ref: "#/components/schemas/TaskTarget"
        baseBranch:
          type: string
        baseCommit:
          type:
            - string
            - "null"
          pattern: ^(?:[0-9a-f]{40}|[0-9a-f]{64})$
          description: Create the worktree at exactly this commit (full lowercase hex id) instead of freshening baseBranch to its upstream tip. Fetched from origin when missing; 422 when it cannot be used. baseBranch stays the PR target. null or absent = resolve from baseBranch.
        afterSession:
          type:
            - string
            - "null"
          pattern: ^[A-Za-z0-9-]{1,64}$
          description: Predecessor task (#2589), by session id or designation (TASK-07). Until its PR has landed (merged, or squash-merged into its epic's integration branch) the task is held (200 HeldTask with reason `after`) and spawns once it lands. Already landed → spawns now. Unknown → 404 after_not_found; archived without landing → 409 after_not_landed.
        prompt:
          type: string
          minLength: 1
          maxLength: 8000
        agentProvider:
          $ref: "#/components/schemas/AgentProvider"
        model:
          type:
            - string
            - "null"
        effort:
          $ref: "#/components/schemas/Effort"
        executionEffort:
          description: "Plan-gated execution effort (#3434): switched to at Go; null/absent = inherit (no switch)."
          $ref: "#/components/schemas/Effort"
        images:
          type: array
          items:
            type: string
        planGateEnabled:
          type:
            - boolean
            - "null"
        autopilotEnabled:
          type:
            - boolean
            - "null"
        sandboxProfile:
          $ref: "#/components/schemas/SandboxProfile"
        plain:
          type: boolean
        force:
          type: boolean
          description: Bypass the usage-hold gate and spawn immediately.
        mergeTrainPrs:
          type: array
          items:
            type: integer
          description: PR numbers for a merge-train kickoff. Present ⇒ this create is a train, not an ordinary task.
        issueRef:
          $ref: "#/components/schemas/IssueRef"
        research:
          type: boolean
          description: Start in research mode — no worktree writes, no PR.
        epicAuthoring:
          type: boolean
          description: Start in epic-authoring mode.
        bootstrap:
          type: boolean
          description: Start in bootstrap mode — pinned stack, scaffold and guardrails as one PR.
        attachmentNames:
          type: array
          items:
            type: string
          description: Display names for `images`, positionally. The server rejects a length mismatch with 400 (src/validate.ts:287-291).
        launchUiState:
          $ref: "#/components/schemas/LaunchUiState"
        requirements:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/Capability"
          description: Capabilities the machine that runs the task must have. While machines are connected the automatic choice only picks a machine whose report has them all. The machine that runs it verifies them by a fresh probe when it accepts the task; a missing one answers 422 with code missing_capabilities and nothing starts.
        placement:
          $ref: "#/components/schemas/Placement"
    ArchiveSessionRequest:
      type: object
      additionalProperties: false
      properties:
        reap:
          type: array
          items:
            type: string
          description: Explicitly selected leftover keys from the session leftovers probe.
    HeldTask:
      type: object
      additionalProperties: true
      description: "The usage hold tripped — the task was queued instead of spawned. With `host` it was held on that connected machine (`id` and `count` are that machine's). With `waiting` (#2775) it waits HERE for `host`, the machine it is meant for, which is out of reach: nothing was sent, it starts there once that machine can take it — `id` is the dispatch ID, `count` the tasks waiting here, `dispatch` the waiting RemoteDispatch (cancel or redirect it via /api/remote-dispatches)."
      required:
        - held
        - id
        - count
      properties:
        held:
          type: boolean
        id:
          type: string
        count:
          type: integer
        reason:
          $ref: "#/components/schemas/HeldReason"
        host:
          $ref: "#/components/schemas/SessionHost"
        waiting:
          type: boolean
        dispatch:
          $ref: "#/components/schemas/RemoteDispatch"
    DispatchState:
      anyOf:
        - $ref: "#/components/schemas/DispatchStateKnown"
        - type: string
    DispatchStateKnown:
      type: string
      enum:
        - pending
        - started
        - held
        - failed
    Dispatch:
      type: object
      additionalProperties: true
      description: The outcome of a POST /api/sessions submitted with an Idempotency-Key. pending = the start is still running; started = sessionId spawned; held = parked as held task heldId (it turns started when the hold is released); failed = it will never start (reason, code).
      required:
        - id
        - state
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        state:
          $ref: "#/components/schemas/DispatchState"
        sessionId:
          type: string
        heldId:
          type: string
        reason:
          type: string
        code:
          type: string
          description: Machine-readable failure code when there is one — dispatch_canceled (withdrawn before it arrived), dispatch_interrupted (a restart cut the start off), held_discarded, or the create's own code (e.g. spawn_canceled).
        createdAt:
          type: integer
        updatedAt:
          type: integer
    RemoteDispatchState:
      anyOf:
        - $ref: "#/components/schemas/RemoteDispatchStateKnown"
        - type: string
    RemoteDispatchStateKnown:
      type: string
      enum:
        - sending
        - unknown
        - canceling
        - started
        - held
        - rejected
        - upload_failed
        - canceled
        - waiting
        - redirected
    RemoteDispatch:
      type: object
      additionalProperties: true
      description: "A task this instance sent — or keeps to send — to a connected machine (POST /api/sessions with a target, or placed there automatically), as GET /api/remote-dispatches lists it and remote:dispatch announces it. unknown = it was sent but no answer came back, so it may be running there (start status unknown); this instance asks the machine after every check that finds it connected and settles it, or sends the same task again to the same machine if it never arrived. canceling = canceled here, the cancel reaches the machine as soon as it answers. waiting (#2775) = the machine it is meant for is out of reach or cannot take it yet: nothing was sent; it is sent after a check that finds the machine connected, the project checked out and — on a capability check the machine runs right then — every requirement met (`readiness` says what is missing now, `placement` why it is meant for that machine, `alternatives` the connected machines that could run it now). held = the machine holds it (its usage hold or capacity; heldId on that machine) and starts it when it can. started (sessionId), rejected (reason, code — e.g. dispatch_interrupted: the machine restarted mid-start; held_discarded: dropped from its held queue), canceled (it never starts there; code machine_removed when its machine was removed here), upload_failed (an attachment did not get there; never sent). sending = being sent right now. redirected = it left the machine's queue to run on this instance — only announced, never listed."
      required:
        - id
        - state
        - host
        - summary
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: The dispatch ID — what the machine received as its Idempotency-Key.
        state:
          $ref: "#/components/schemas/RemoteDispatchState"
        host:
          $ref: "#/components/schemas/SessionHost"
        summary:
          type: string
          description: The task's issue title, else the first line of its prompt (at most 120 characters).
        sessionId:
          type: string
          description: The session on the machine, once started.
        heldId:
          type: string
          description: The held task on the machine, once held.
        reason:
          type: string
        code:
          type: string
        createdAt:
          type: integer
        updatedAt:
          type: integer
        placement:
          $ref: "#/components/schemas/Placement"
        readiness:
          $ref: "#/components/schemas/DispatchReadiness"
        alternatives:
          type: array
          description: "Waiting only: the connected machines — this instance included — that fit the task now, best first. A redirect to one of them is accepted; nothing goes there on its own."
          items:
            $ref: "#/components/schemas/SessionHost"
    DispatchReadiness:
      type: object
      additionalProperties: true
      required:
        - state
      description: "How far the machine a waiting task is meant for is from taking it (#2775), judged as the automatic choice judges it. offline: not connected (`status` says why — unreachable, unauthorized, …); unreleased: its platform runs no tasks; project_missing: no checkout of the project; missing_capabilities: its capability report lacks a requirement (`missing`; reason not_verified while no fresh report confirms one); ready: it fits — the task goes out with the next check."
      properties:
        state:
          anyOf:
            - type: string
              enum:
                - offline
                - unreleased
                - project_missing
                - missing_capabilities
                - ready
            - type: string
        status:
          type: string
        missing:
          type: array
          items:
            type: object
            additionalProperties: true
            required:
              - capability
              - reason
            properties:
              capability:
                type: string
              reason:
                type: string
    RedirectRequest:
      type: object
      additionalProperties: false
      required:
        - target
      properties:
        target:
          $ref: "#/components/schemas/TaskTarget"
    RemoteDispatchList:
      type: object
      additionalProperties: true
      required:
        - dispatches
      properties:
        dispatches:
          type: array
          items:
            $ref: "#/components/schemas/RemoteDispatch"
    Placement:
      type: object
      additionalProperties: true
      required:
        - mode
        - target
        - requirements
        - basis
        - preferred
        - by
        - decidedAt
      description: "Where a task was placed and why: the record of the Shepherd that chose the machine. It is language-neutral; clients put it into words. A session placed while machines were connected carries it as `launchMetadata.placement`, on the machine that runs it as well, and a held task keeps it in its stored input. It is a record only and never decides where a task runs. In a create body (CreateSessionRequest.placement) it is what a coordinator Shepherd sends along with a task it placed on another instance: that instance keeps it only when the body's `target` names that instance itself and the record names it as its `target`; otherwise the instance records its own choice instead. Clients do not send it."
      properties:
        mode:
          description: auto = chosen by the rules; manual = the machine named in `target`.
          anyOf:
            - type: string
              enum:
                - auto
                - manual
            - type: string
        target:
          $ref: "#/components/schemas/SessionHost"
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        basis:
          description: "What decided: the operator (manual), the requirements — only one platform fits (requirements), the platform order among several fitting machines (preference, with `preferred`), or that only one machine can run the task at all (only_candidate). load means the preferred machine was busy and another fitting connected machine had fresh spare capacity."
          anyOf:
            - type: string
              enum:
                - manual
                - requirements
                - preference
                - only_candidate
                - load
            - type: string
        preferred:
          type:
            - string
            - "null"
          description: The platform the order preferred among several that fit; null when the order did not decide.
        by:
          type: object
          additionalProperties: true
          required:
            - instanceId
            - name
          description: The Shepherd that decided.
          properties:
            instanceId:
              type: string
            name:
              type: string
        decidedAt:
          type: integer
        load:
          $ref: "#/components/schemas/PlacementLoad"
    PlacementRequest:
      type: object
      additionalProperties: false
      required:
        - repoPath
      properties:
        repoPath:
          type: string
        requirements:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/Capability"
        target:
          $ref: "#/components/schemas/TaskTarget"
    PlacementRefusal:
      type: object
      additionalProperties: true
      required:
        - code
        - error
      description: "Why POST /api/sessions would refuse the task, as it would answer it. no_suitable_machine (422): no machine fits — `missing` lists the capabilities no connected machine with the project has (all of them with `together` when none has them together), `elsewhere` the connected machines that would fit but have no checkout of the project. missing_capabilities (422): the named machine lacks requirements — `host` and `missing` as {capability, reason}; reason not_verified when no fresh report confirms one. remote_target_unknown, remote_target_unavailable, remote_target_unreleased, remote_project_missing, remote_project_unknown: the named machine cannot take a task (see POST /api/sessions)."
      properties:
        code:
          type: string
        error:
          type: string
        host:
          $ref: "#/components/schemas/SessionHost"
        reason:
          type: string
        together:
          type: boolean
        elsewhere:
          type: array
          items:
            $ref: "#/components/schemas/SessionHost"
    PlacementPreview:
      type: object
      additionalProperties: true
      required:
        - active
      properties:
        active:
          type: boolean
          description: "false: no connected machine could take a task, so a create runs here exactly as it always did and the form shows no machine choice."
        placement:
          $ref: "#/components/schemas/Placement"
        wait:
          $ref: "#/components/schemas/PlacementWait"
        refusal:
          $ref: "#/components/schemas/PlacementRefusal"
        deriveRequirements:
          type: boolean
          description: "Present while `active`. true: reading the task's requirements can change where it runs — no target was named, and the machines that could take it differ in what a task can call for (Xcode, the iOS SDK, the iOS simulator, the Android SDK). A client then waits for POST /api/requirements/derive before submitting, as New Task does. false: it cannot; a client may still read them to show what the task needs (New Task does under Automatic), but need not wait."
        machines:
          type: array
          description: "Present while `active` (#2776): the machines a create may name in `target` for this repo right now — this instance first, then every connected machine whose platform is released for tasks and that has the project checked out (by forge slug). A client that cannot list the connected machines itself (GET /api/remote-instances needs an operator session, which a native app's token is not) offers these under Run on. Whether one fits the requirements is what a preview with it as `target` answers."
          items:
            $ref: "#/components/schemas/SessionHost"
    PlacementWait:
      type: object
      additionalProperties: true
      required:
        - status
        - alternatives
      description: "The machine in `placement` is out of reach (#2775): POST /api/sessions stores the task to wait for it (a HeldTask with `waiting`) and sends it there once it can take it — it never falls back to another machine on its own. `status` says why it is out of reach; `alternatives` are the connected machines, this instance included, that fit too — a manual choice away."
      properties:
        status:
          type: string
        alternatives:
          type: array
          items:
            $ref: "#/components/schemas/SessionHost"
    RequirementsDeriveRequest:
      type: object
      additionalProperties: false
      required:
        - repoPath
        - prompt
      description: "The task as it would be submitted: the prompt, the attached issue's title and body, and the staged attachments (`images`, paths from POST /api/upload — only images are looked at). The prompt, the issue title or the attachments must not be empty. The repository is never read."
