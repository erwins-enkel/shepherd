                $ref: "#/components/schemas/Error"
    put:
      operationId: putApnsConfig
      description: Stores APNs credentials after validating them (EC P-256 key, 10-character key and team IDs, bundle-id topic) and reloads the sender without a restart. Operator session only.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApnsConfigRequest"
      responses:
        "200":
          description: The configuration, without the key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApnsStatus"
        "400":
          description: Malformed body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not an operator session (a bearer token cannot manage push).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The field is set by the environment and cannot be changed here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApnsConfigError"
        "422":
          description: Validation failed; `field` names the offending input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApnsConfigError"
        "503":
          description: Native iOS push is not available on this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteApnsConfig
      description: Forgets the stored credentials; values from the environment stay in force. Operator session only.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The configuration, without the key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApnsStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not an operator session (a bearer token cannot manage push).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Native iOS push is not available on this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/judge/connection:
