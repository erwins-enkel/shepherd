name: CI

on:
  pull_request:
    # Also run on PRs targeting an epic integration branch (epic/**) so epic-child
    # PRs get CI — the adversarial reviewer gates on green CI, which the epic drain
    # needs. The Fallow audit already diffs against origin/${{ github.base_ref }},
    # so it scopes to the epic base automatically (no other job is base-relative).
    branches: [main, "epic/**"]
  push:
    branches: [main]

permissions:
  contents: read

# Cancel in-progress runs for the same PR / branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── The PR gate: four parallel lanes behind the `verify` aggregator ─────────────
  # KEEP IN SYNC WITH .husky/pre-push (scripts/pre-push.ts). The local pre-push hook
  # doesn't share these jobs' shell bodies — it runs the same gate set in parallel
  # lanes via scripts/pre-push.ts. When you add/remove/move a step in static/test-root/
  # test-ui/test-ui-browser, mirror it there (and vice-versa). Deliberate differences:
  # the hook scopes prettier/eslint to the push delta and pins fallow@2.100.0;
  # CI keeps the whole-repo checks. The pin is gated: scripts/check-fallow-pin.mjs
  # fails when any site names a different version. On a docs-only delta (the `changes` rules
  # below) the hook drops the type checks along with the test lanes; `static` still runs them.
  #
  # Every lane carries the same release-please guard. Don't run the suite on
  # release-please's generated PR: it only bumps the version + CHANGELOG, so the gate is
  # wasted minutes. That PR DOES trigger this workflow — see release-please.yml. Skip
  # ONLY when BOTH the head branch carries the release-please prefix AND the PR author is
  # the release bot (the App token `shepherd-release-please[bot]`, or the legacy
  # `github-actions[bot]` fallback). Public-repo hardening: gating on the branch name
  # ALONE let any fork PR named `release-please--*` skip every required check — and a
  # skipped required job reports "skipped", which the branch ruleset counts as passing.
  # A fork author can spoof the branch name but not the bot identity. head_ref is empty
  # on push-to-main, so main still runs. NB: this only skips the JOB once the run
  # starts; GitHub's separate bot-PR "awaiting approval" gate is a repo setting.
  #
  # Every lane is pinned to GitHub-hosted: the repo is public, so hosted minutes are
  # free and a self-hosted runner would execute fork-PR code on our host. Deliberately
  # NOT the old `vars.CI_RUNNER ||` toggle — a single `gh variable set` must not be able
  # to re-arm the self-hosted path (see ci/self-hosted-runner/README.md).
  #
  # Installs go through the shared retry-with-store-purge composite action
  # (.github/actions/bun-install-retry) so a one-off native-tarball-extraction flake
  # self-heals instead of redding the lane (#1134, extending docs-site's #944).

  # Which lanes this PR can skip (#2568): scripts/ci-changes.mjs diffs the PR against its
  # base and emits test/site/cli/docs_site booleans. Gated jobs read them via a job-level
  # `if:`, never workflow `paths:` — a required check that never reports deadlocks the PR
  # (#1859); an `if:`-skipped job reports "skipped", which the ruleset counts as passing.
  # Fail-open: gated jobs use `!cancelled()` and run anyway when this job fails, and
  # `verify` goes red. Pushes to main always run everything. scripts/pre-push.ts reads the same
  # rules for its push delta, so a docs-only push skips the test lanes locally too (#2915).
  changes:
    name: changes
    if: ${{ !(startsWith(github.head_ref, 'release-please--') && (github.event.pull_request.user.login == 'shepherd-release-please[bot]' || github.event.pull_request.user.login == 'github-actions[bot]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      test: ${{ steps.classify.outputs.test }}
      site: ${{ steps.classify.outputs.site }}
      cli: ${{ steps.classify.outputs.cli }}
      docs_site: ${{ steps.classify.outputs.docs_site }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Diffs against origin/<base>...HEAD — needs the base branch and merge base.
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/ci-changes.mjs

  # Lint, typechecks, freshness gates and fallow — everything that fails fast.
  static:
    name: static
    if: ${{ !(startsWith(github.head_ref, 'release-please--') && (github.event.pull_request.user.login == 'shepherd-release-please[bot]' || github.event.pull_request.user.login == 'github-actions[bot]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Fallow's PR audit diffs against the base branch — needs full history.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install (root)
        uses: ./.github/actions/bun-install-retry

      - name: Install (ui)
        uses: ./.github/actions/bun-install-retry
        with:
          working-directory: ui

      - name: Install (extension)
        uses: ./.github/actions/bun-install-retry
        with:
          working-directory: extension

      # Persist prettier + eslint caches across runs so the Lint step is a few
      # seconds on a WARM cache instead of >1 min cold (#1192). Both linters write
      # to repo-root .cache/ (--cache-location) with --cache-strategy content — the
      # default `metadata` strategy keys on mtime, which a fresh CI checkout always
      # busts, so it would silently no-op. Stable hash-only key + prefix restore-keys
      # mirrors the docs-site bun-store cache below: one entry per config/lockfile
      # lineage (no per-commit churn against GitHub's 10 GB LRU budget). Cold/miss
      # runs (config/dep bump, eviction, fresh lineage) fall back to today's cost.
      - name: Restore lint cache
        uses: actions/cache@v6
        with:
          path: |
            .cache
            extension/.cache
          key: ${{ runner.os }}-lint-${{ hashFiles('eslint.config.js', 'extension/eslint.config.js', '.prettierrc', '.prettierignore', 'bun.lock', 'extension/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-lint-

      - name: Lint (prettier + eslint)
        # Per-command timing (#1192): attributes the Lint minute on real CI hardware
        # (local cold total is only ~22s) and gives a cold→warm before/after across
        # the PR's own runs. eslint cache flags live in the `lint` npm scripts.
        run: |
          s=$SECONDS; bunx prettier --check --cache --cache-strategy content --cache-location .cache/prettier .; echo "⏱ prettier --check: $((SECONDS - s))s"
          s=$SECONDS; bun run lint; echo "⏱ eslint (root): $((SECONDS - s))s"
          s=$SECONDS; (cd extension && bun run lint); echo "⏱ eslint (extension): $((SECONDS - s))s"

      - name: Typecheck (root tsc)
        run: bun run typecheck

      - name: Typecheck (ui svelte-check)
        run: cd ui && bun run check

      - name: Typecheck (extension svelte-check)
        run: cd extension && bun run check

      - name: i18n catalog parity (en ↔ de)
        run: |
          (cd ui && bun run check:i18n)
          (cd extension && bun run check:i18n)

      # Runs here, not in native.yml, so a ui/messages-only PR doesn't start the
      # macOS pipeline (#2567). Plain Bun script, no macOS tooling.
      - name: Mac string catalog freshness (ui/messages ⇒ xcstrings)
        run: bun run check:strings

      - name: Docs manifest freshness (command bar Docs group)
        run: cd ui && bun run check:docs-manifest

      - name: herdr protocol types freshness (schema ⇒ regenerated types)
        run: bun run check:herdr-types

      - name: Rust contract freshness (openapi.yaml ⇒ derived progenitor spec)
        run: bun run check:contract-rust

      # Env-schema drift (#2347): every env var src/, scripts/ and deploy/ read must be
      # declared in .env.schema, and every declared key must still be read. Both directions
      # exit 1 with file:line. The scanner cannot see shell scripts or indirect reads, so
      # those keys are declared @auditIgnore and are NOT covered here.
      - name: Env schema drift (.env.schema ⇔ code)
        run: bun run check:env-schema

      # Docs parity (#2361): every gated SHEPHERD_* key in .env.schema must also have a row on
      # the Configuration page, so a new operator knob cannot ship undocumented. A key that is
      # genuinely contributor-only carries @docsExempt in the schema instead.
      - name: Env schema docs parity (.env.schema ⇒ configuration.md)
        run: bun run check:env-schema-docs

      # Prompt fingerprints (#2156): a prompt-builder edit must regenerate
      # scripts/eval-fingerprints.json, which is what eval-prompts.yml compares against the PR base
      # to decide which live evals to run. Without this gate a prompt change could ship with a
      # stale fingerprint and silently skip its own eval.
      - name: Eval prompt fingerprints freshness (prompt builders ⇒ regenerated hashes)
        run: bun run check:eval-fingerprints

      - name: Fallow audit (PR delta)
        # Only new findings introduced by the PR block — inherited issues don't.
        # Skip on direct pushes to main: there's no base branch to diff against.
        # Version pinned (not @latest) so analyzer changes are adopted deliberately,
        # not on a random CI run. The synthetic Svelte <template> complexity metric
        # (fallow 2.98+) is adopted via health.thresholdOverrides in .fallowrc.jsonc
        # (#851) — a Svelte-appropriate bar so new components aren't churned against the
        # library-default 20/15. The #756 line-shift mis-attribution that forced the old
        # 2.97 pin was re-tested against 2.100 and does NOT reproduce (inherited template
        # findings now attribute correctly across line shifts). Every site naming this
        # version is gated by scripts/check-fallow-pin.mjs — bump them together.
        if: github.event_name == 'pull_request'
        run: bunx fallow@2.100.0 audit --base origin/${{ github.base_ref }} --fail-on-issues

  # The root suite, sharded across runners. Deliberately `--shard`, not `--parallel`: Bun 1.4's
  # --parallel workers intermittently lose subprocess exit notifications or deadlock
  # (oven-sh/bun#39987, #43697) — in #2566's stress runs 2 of 21 went red (one hang, one run of
  # false 5s timeouts). Each shard runs serially in its own process, the mode main has always run.
  # Revisit --parallel once those are fixed. Never add `--randomize`: the contract coverage
  # gates depend on test order within a file.
  test-root:
    name: test-root (${{ matrix.shard }}/2)
    needs: changes
    if: ${{ !cancelled() && !(startsWith(github.head_ref, 'release-please--') && (github.event.pull_request.user.login == 'shepherd-release-please[bot]' || github.event.pull_request.user.login == 'github-actions[bot]')) && (needs.changes.result != 'success' || needs.changes.outputs.test == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # test/native-fixture-conservation.test.ts fetches pinned commits from the checkout.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # All three: root tests import ui/src modules and spawn tools inside ui/ + extension/.
      - name: Install (root)
        uses: ./.github/actions/bun-install-retry

      - name: Install (ui)
        uses: ./.github/actions/bun-install-retry
        with:
          working-directory: ui

      - name: Install (extension)
        uses: ./.github/actions/bun-install-retry
        with:
          working-directory: extension

      - name: Test (root, shard ${{ matrix.shard }}/2)
        # server.test.ts creates its temp repo inside repoRoot (default
        # $HOME/Work, absent on the runner). Point it at a writable temp dir.
        # The GIT_* identity vars let tests that author real commits (e.g.
        # createProject's bootstrap commit) run on a runner without a global
        # git config; they must be set here because Bun does not propagate
        # in-process env mutations to child processes.
        env:
          SHEPHERD_REPO_ROOT: ${{ runner.temp }}/reporoot
          GIT_AUTHOR_NAME: t
          GIT_AUTHOR_EMAIL: t@t
          GIT_COMMITTER_NAME: t
          GIT_COMMITTER_EMAIL: t@t
        run: |
          mkdir -p "$SHEPHERD_REPO_ROOT"
          bun test --shard=${{ matrix.shard }}/2 ./test

  # ui node + browser-touch vitest projects, extension tests, and both builds. The big
  # `browser` project runs sharded in test-ui-browser below.
  test-ui:
    name: test-ui
    needs: changes
    if: ${{ !cancelled() && !(startsWith(github.head_ref, 'release-please--') && (github.event.pull_request.user.login == 'shepherd-release-please[bot]' || github.event.pull_request.user.login == 'github-actions[bot]')) && (needs.changes.result != 'success' || needs.changes.outputs.test == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install (ui)
        uses: ./.github/actions/bun-install-retry
        with:
          working-directory: ui

      - name: Install (extension)
        uses: ./.github/actions/bun-install-retry
        with:
          working-directory: extension

      # Skips Chromium's download on a hit; `--with-deps` below still installs the system libs.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ui/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium (ui browser tests)
        timeout-minutes: 10
        # `--with-deps` shells out to `apt-get update`, which refreshes EVERY source configured on
        # the runner image — including Google's Chrome repo. We need none of it: Chromium itself
        # comes from Playwright's own CDN, and the deps `--with-deps` installs are Ubuntu system
        # libraries. But apt exits non-zero when ANY index fails, so a broken third-party index
        # takes the whole job down: on 2026-09-09 that repo served a `Packages.gz` that did not
        # match the hash its own `Release` advertised, and every run failed on `Hash Sum mismatch`
        # for hours, deterministically — a re-run could not clear it.
        #
        # So drop the source we never use before apt reads it. `-f` + the glob keep this a no-op on
        # an image that stops shipping Chrome, or that switches to the deb822 `.sources` spelling.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          cd ui && bunx playwright install --with-deps chromium

      - name: Test (ui node + browser-touch)
        run: cd ui && bunx vitest run --project node --project browser-touch

      - name: Test (extension)
        run: cd extension && bun run test

      - name: Build (ui)
        # Builds, and fails on INEFFECTIVE_DYNAMIC_IMPORT (a static import that defeats
        # a dynamic one — Rollup only warns, so the build would otherwise stay green).
        # Same script as the pre-push hook's ui build lane, so the two stay in sync.
        run: ./scripts/check-ui-build.sh

      - name: Build (extension)
        run: cd extension && bun run build

  # The ui `browser` vitest project (~160 files, the single slowest suite), sharded across
  # runners. Start at 2 shards and watch job queue time against the org's 60-job limit.
  test-ui-browser:
    name: test-ui-browser (${{ matrix.shard }}/2)
    needs: changes
    if: ${{ !cancelled() && !(startsWith(github.head_ref, 'release-please--') && (github.event.pull_request.user.login == 'shepherd-release-please[bot]' || github.event.pull_request.user.login == 'github-actions[bot]')) && (needs.changes.result != 'success' || needs.changes.outputs.test == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install (ui)
        uses: ./.github/actions/bun-install-retry
        with:
          working-directory: ui

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ui/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        timeout-minutes: 10
        # Same apt-source workaround as test-ui — see the comment there.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          cd ui && bunx playwright install --with-deps chromium

      - name: Test (ui browser, shard ${{ matrix.shard }}/2)
        run: cd ui && bunx vitest run --project browser --shard=${{ matrix.shard }}/2

  # The required check. Keeps the `verify` name so the branch ruleset needs no change when
  # lanes are added or split. `always()` so a failed lane still reports a red `verify`
  # instead of a skipped (= passing) one; it then fails unless every lane succeeded, or was
  # skipped because `changes` said so (test lanes only; `changes` and `static` must succeed).
  # The release-please guard skips it too — the same "skipped" the old single job reported.
  verify:
    name: verify
    needs: [changes, static, test-root, test-ui, test-ui-browser]
    if: ${{ always() && !(startsWith(github.head_ref, 'release-please--') && (github.event.pull_request.user.login == 'shepherd-release-please[bot]' || github.event.pull_request.user.login == 'github-actions[bot]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All lanes green
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq '.changes.outputs.test as $t | [to_entries[]
            | select(.value.result != "success")
            | select((.value.result == "skipped" and (.key | startswith("test-")) and $t == "false") | not)
          ] | length')
          if [ "$bad" -ne 0 ]; then echo "::error::$bad lane(s) not successful"; exit 1; fi

  # The Astro Starlight docs site (docs-site/) is a 4th in-monorepo package with
  # its own lockfile. It builds self-contained — TypeDoc reads ../src via a
  # dedicated typedoc.tsconfig.json (own @types/bun, skipErrorChecking, disableGit)
  # and sync-docs.mjs reads checked-in files — so it needs only a plain checkout +
  # its own install, NOT the root/ui/extension installs. It lives in its OWN job
  # (not a step in `verify`) so a flaky pagefind install can't red the whole suite:
  # `pagefind` (the search indexer) ships its native binary as optional, platform-
  # specific deps (@pagefind/linux-x64, …) whose npm-tarball extraction during
  # `bun install` occasionally flakes (#944). NB: this workflow triggers only on
  # `branches: [main]`, so this job is dormant on docs-epic PRs (which target the
  # epic branch) and first runs when an epic merges to main.
  docs-site:
    name: docs-site
    # Skip release-please's generated PR (version/CHANGELOG bump only), mirroring
    # the PR-gate lanes' branch+bot-identity guard above (branch-name-only was a
    # fork-spoofable check-skip). head_ref is empty on push-to-main, so main runs.
    needs: changes
    if: ${{ !cancelled() && !(startsWith(github.head_ref, 'release-please--') && (github.event.pull_request.user.login == 'shepherd-release-please[bot]' || github.event.pull_request.user.login == 'github-actions[bot]')) && (needs.changes.result != 'success' || needs.changes.outputs.docs_site == 'true') }}
    # Pinned to GitHub-hosted like the PR-gate lanes — public repo, no CI_RUNNER toggle.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # Cache bun's global store so the pagefind tarball isn't re-DOWNLOADED every
      # run (speed + download-flake mitigation). This does NOT reduce extraction
      # events — extraction into node_modules happens every run regardless — so the
      # retry below, not this cache, is what absorbs the tarball-extraction flake.
      - name: Cache bun store (docs-site)
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-docs-site-${{ hashFiles('docs-site/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-docs-site-

      # Install via the shared retry-with-store-purge composite action
      # (.github/actions/bun-install-retry) so a one-off @pagefind tarball-extraction
      # flake (#944) self-heals: it purges the bun store before the final attempt so a
      # poisoned half-written tarball is re-downloaded fresh. Only the install is
      # retried — re-running check/build on a genuine type/content error would burn 3×
      # the time. The cache step above still precedes (and is purged by) this install.
      - name: Install (docs-site)
        uses: ./.github/actions/bun-install-retry
        with:
          working-directory: docs-site

      - name: Build (docs-site)
        working-directory: docs-site
        run: |
          bun run check
          bun run build

  # The shepherd.run marketing site (site/) is the 5th in-monorepo package with its
  # own lockfile. Like docs-site it builds self-contained, so it needs only a plain
  # checkout + its own install, and it lives in its OWN job for the same reason: an
  # install flake there must not red the whole suite.
  #
  # Deliberately NOT filtered with workflow `paths:` (#1859). A path-filtered job reports
  # no status at all on PRs that don't touch those paths, and a required check that never
  # reports blocks the PR from merging forever. It is gated by a job-level `if:` on the
  # `changes` job instead (#2568), which reports "skipped" (= passing).
  #
  # NB the fonts pipeline reaches cdn.jsdelivr.net at BUILD time (the npm font provider
  # fetches the woff2 for the lockfile-pinned @fontsource version), so this job needs
  # network during `build`, not just during install. A fetch failure fails the build
  # loudly. That is deliberately left unretried, matching every other build step here —
  # `bun-install-retry` wraps installs only, and the repo adds retries in response to
  # observed flakes (#944, #1134), not in anticipation of one.
  site:
    name: site
    # Skip release-please's generated PR, mirroring the two jobs above.
    needs: changes
    if: ${{ !cancelled() && !(startsWith(github.head_ref, 'release-please--') && (github.event.pull_request.user.login == 'shepherd-release-please[bot]' || github.event.pull_request.user.login == 'github-actions[bot]')) && (needs.changes.result != 'success' || needs.changes.outputs.site == 'true') }}
    # Pinned to GitHub-hosted like the others — public repo, no CI_RUNNER toggle.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Cache bun store (site)
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-site-${{ hashFiles('site/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-site-

      - name: Install (site)
        uses: ./.github/actions/bun-install-retry
        with:
          working-directory: site

      # check + build, then assert on what the build actually emitted: a green
      # `astro build` does NOT prove the site is correct. Point a font family's
      # provider at a package it can't resolve and the build still exits 0 with only
      # a [WARN], shipping a dist/ where that family silently degraded to system
      # fonts. check:artifacts is what catches that; its own logic is unit-tested in
      # test/check-build-artifacts.test.ts, which runs in `test-root`.
      - name: Build (site)
        working-directory: site
        run: |
          bun run check
          bun run build
          bun run check:artifacts

  # The Rust `shepherd` CLI (cli/), the one Cargo crate in the repo. Its client is generated at
  # build time from contracts/openapi.rust.yaml, so this job is also the gate that a contract change
  # still produces a client the CLI compiles against. Own job (not a `verify` step) for the same
  # reason as docs-site/site; gated by `changes` via job-level `if:`, never workflow `paths:`
  # (#1859). The commands live in scripts/check-cli.sh, which the pre-push `cli` lane runs too.
  cli:
    name: cli
    # Skip release-please's generated PR, mirroring the jobs above.
    needs: changes
    if: ${{ !cancelled() && !(startsWith(github.head_ref, 'release-please--') && (github.event.pull_request.user.login == 'shepherd-release-please[bot]' || github.event.pull_request.user.login == 'github-actions[bot]')) && (needs.changes.result != 'success' || needs.changes.outputs.cli == 'true') }}
    # Pinned to GitHub-hosted like the others — public repo, no CI_RUNNER toggle.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli

      # fmt --check, clippy -D warnings, test — shared with the pre-push `cli` lane.
      - name: Check (cli)
        run: bash scripts/check-cli.sh
