name: native

# ShepherdKit is generated from contracts/openapi.swift.yaml, so this job is the
# gate that a contract change still produces code that compiles and passes.
# Paths-filtered so a PR that touches neither the contract nor native/ does
# not pay for a macOS runner.
#
# `ui/messages/*.json` is in the filter for sub-project 4a: the Mac app's string
# catalog is generated from those files, and its freshness check lives in this
# same job. Keep the entry even though nothing in ShepherdKit reads it.
on:
  pull_request:
    branches: [main, "epic/**"]
    paths:
      - "native/**"
      - "contracts/**"
      - "scripts/gen-contract-swift.ts"
      - "ui/messages/*.json"
      - ".github/workflows/native.yml"
  push:
    branches: [main]
    paths:
      - "native/**"
      - "contracts/**"
      - "scripts/gen-contract-swift.ts"
      - "ui/messages/*.json"
      - ".github/workflows/native.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job key `shepherdkit` is load-bearing: sub-project 4a appends the Shepherd.app
  # build, signature check and unit-test steps to THIS job. Do not rename it.
  shepherdkit:
    name: ShepherdKit
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Conservation reads the pinned upstream test Git objects.
          fetch-depth: 0

      - name: Report the toolchain
        run: |
          swift --version
          native/scripts/uitest-lock.sh xcodebuild -version

      # The three Apple OpenAPI packages all ship swift-tools-version:6.1. This
      # job also builds Shepherd.app below, and Terminal/TerminalHostView.swift
      # spells its SwiftTerm delegate conformance as an SE-0470 isolated
      # conformance (`NSObject, @MainActor TerminalViewDelegate`) — a plain
      # conformance is a hard error under strict concurrency, and SE-0470 needs
      # Swift 6.2. An older default Xcode on the runner would otherwise fail
      # with a confusing manifest or conformance error instead of a clear one.
      - name: Require Swift 6.2 or newer
        run: |
          set -euo pipefail
          version="$(swift -version 2>&1 | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p')"
          if [ -z "$version" ]; then
            echo "::error::could not parse swift version"
            exit 1
          fi
          echo "detected swift $version"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          if [ "$major" -lt 6 ] || { [ "$major" -eq 6 ] && [ "$minor" -lt 2 ]; }; then
            echo "::error::Swift $version is too old; Shepherd.app needs 6.2+."
            echo "Installed Xcodes:"; ls /Applications | grep -i '^Xcode' || true
            echo "Pin a newer one with: sudo xcode-select -s /Applications/<Xcode>.app"
            exit 1
          fi

      # SwiftPM checkouts + build products for native/'s three Apple deps.
      # Keyed on Package.resolved so a dependency bump busts the cache instead
      # of silently reusing a stale checkout; restore-keys lets a cache miss
      # on that exact hash still warm-start from the most recent one.
      - name: Cache SwiftPM build state
        uses: actions/cache@v6
        with:
          path: |
            native/.build
            native/Apps/ShepherdMac/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('native/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install root deps
        uses: ./.github/actions/bun-install-retry

      # Gate 1: the derived Swift contract still matches the truth file.
      # (Regenerates contracts/openapi.swift.yaml and runs git diff --exit-code.)
      - name: Derived contract is current
        run: bun run check:contract-swift

      # Gate 2: the copy inside the ShepherdKit target still matches the
      # derived contract. The generated Swift itself is never committed — the
      # build plugin regenerates it every build, so it cannot go stale; these
      # two copies are the only artefacts that CAN drift.
      - name: Contract copy is in sync
        run: ./native/scripts/sync-contract.sh --check

      # Gate 3: the contract still generates code that compiles and passes.
      - name: Build
        run: swift build --package-path native

      # The Keychain round-trip tests in CredentialStoreTests need an
      # unlocked, default keychain to write to — macos-latest runners start
      # with none attached non-interactively. Without this, SecItemAdd fails
      # with errSecInteractionNotAllowed and those tests would only run
      # locally. `runner.os == 'macOS'` is always true for this job, but the
      # guard keeps the step honest if it's ever copied to a non-mac runner.
      - name: Prepare a test keychain
        if: runner.os == 'macOS'
        working-directory: ${{ runner.temp }}
        run: |
          security create-keychain -p "" ci.keychain-db
          security set-keychain-settings -lut 21600 ci.keychain-db
          security unlock-keychain -p "" ci.keychain-db
          security list-keychains -d user -s ci.keychain-db $(security list-keychains -d user | tr -d '"')
          security default-keychain -s ci.keychain-db

      - name: Test ShepherdKit
        # Test traits use cooperative cancellation; also bound a blocked thread
        # or an unresumed continuation that cannot respond to cancellation.
        timeout-minutes: 20
        # The `SecItem*` tests are opt-in: locally they would make macOS ask
        # the operator to approve a freshly signed test runner's access to the
        # login keychain, which stalls an unattended run. CI is the one place
        # that always has a throwaway keychain (the step above), so it is the
        # one place that switches them on. Dropping this variable makes
        # `keychainIsUsableOnCI` fail rather than silently skipping the suite.
        env:
          SHEPHERD_KEYCHAIN_TESTS: "1"
        run: |
          set -euo pipefail
          swift test --package-path native --no-parallel --filter ShepherdKitTests --xunit-output "$RUNNER_TEMP/kit.xml" 2>&1 | tee "$RUNNER_TEMP/kit.log"
          python3 native/scripts/check-core-results.py --xunit "$RUNNER_TEMP/kit-swift-testing.xml" --target ShepherdKitTests --require-keychain

      - name: Test isolated application core
        # Swift Testing XML aggregates arguments. The blocking simulator job
        # below must also validate the recorded per-argument xcresult inventory.
        timeout-minutes: 20
        run: |
          set -euo pipefail
          unset SHEPHERD_KEYCHAIN_TESTS TEST_RUNNER_SHEPHERD_KEYCHAIN_TESTS
          swift test --package-path native --no-parallel --filter ShepherdAppCoreTests --xunit-output "$RUNNER_TEMP/core.xml" 2>&1 | tee "$RUNNER_TEMP/core.log"
          python3 native/scripts/check-core-results.py --xunit "$RUNNER_TEMP/core-swift-testing.xml"

      - name: Conserve original native scenarios
        run: bun run native/scripts/test-conservation.ts --check

      - name: Remove the test keychain
        if: always() && runner.os == 'macOS'
        working-directory: ${{ runner.temp }}
        run: security delete-keychain ci.keychain-db

      - name: Publish package test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-package-tests
          path: |
            ${{ runner.temp }}/kit.log
            ${{ runner.temp }}/kit.xml
            ${{ runner.temp }}/kit-swift-testing.xml
            ${{ runner.temp }}/core.log
            ${{ runner.temp }}/core.xml
            ${{ runner.temp }}/core-swift-testing.xml
          if-no-files-found: warn
          retention-days: 7

      # ── Shepherd for Mac (sub-project 4a) ───────────────────────────────
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check the string catalog is not stale
        # Fails if ui/messages/{en,de}.json changed without regenerating the
        # xcstrings catalog. Same script the developer runs locally.
        run: bun run check:strings

      - name: Verify update archive authentication
        run: |
          native/scripts/test-update-signature.sh
          python3 native/scripts/test-publish-appcast.py

      - name: Build Shepherd.app
        run: |
          set -euo pipefail
          native/scripts/uitest-lock.sh native/scripts/build-app.sh Release 2>&1 | tail -n 40

      - name: Test update packaging with a disposable key
        run: |
          native/scripts/test-package-update.sh \
            native/Apps/ShepherdMac/.build/Build/Products/Release/Shepherd.app \
            native/Apps/ShepherdMac/.build/SourcePackages/artifacts/sparkle/Sparkle/bin

      - name: Test DMG installation from read-only image and Downloads
        run: |
          native/scripts/test-package-dmg.sh \
            native/Apps/ShepherdMac/.build/Build/Products/Release/Shepherd.app

      - name: Verify the bundle is ad-hoc signed with the hardened runtime
        run: |
          APP=native/Apps/ShepherdMac/.build/Build/Products/Release/Shepherd.app
          codesign -d --entitlements :- "$APP" 2>/dev/null > "$RUNNER_TEMP/ent.plist"
          # The key path's dots are escaped: plutil -extract otherwise reads
          # unescaped dots as nested-keypath separators, not a literal key.
          plutil -extract 'com\.apple\.security\.app-sandbox' raw -o - "$RUNNER_TEMP/ent.plist" | grep -qx false
          if grep -q 'get-task-allow' "$RUNNER_TEMP/ent.plist"; then echo "::error::release bundle carries get-task-allow"; exit 1; fi
          codesign -dv "$APP" 2>&1 | grep -q adhoc
          codesign -dv "$APP" 2>&1 | grep -q runtime
          codesign --verify --strict "$APP"

      - name: Unit tests
        # Blocking. The XCUITest bundle is deliberately NOT run here — see the
        # shepherd-mac-ui job below.
        run: |
          set -euo pipefail
          native/scripts/uitest-lock.sh native/scripts/test-app.sh -parallel-testing-enabled NO -only-testing:ShepherdTests 2>&1 | tail -n 40

  shepherd-app-core-simulator:
    name: ShepherdAppCore (iOS Simulator)
    needs: shepherdkit
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Conservation reads the pinned upstream test Git objects.
          fetch-depth: 0

      - name: Report the toolchain
        run: |
          swift --version
          native/scripts/uitest-lock.sh xcodebuild -version

      - name: Require Swift 6.2 or newer
        run: |
          set -euo pipefail
          version="$(swift -version 2>&1 | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p')"
          if [ -z "$version" ]; then
            echo "::error::could not parse swift version"
            exit 1
          fi
          echo "detected swift $version"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          if [ "$major" -lt 6 ] || { [ "$major" -eq 6 ] && [ "$minor" -lt 2 ]; }; then
            echo "::error::Swift $version is too old; Shepherd.app needs 6.2+."
            echo "Installed Xcodes:"; ls /Applications | grep -i '^Xcode' || true
            echo "Pin a newer one with: sudo xcode-select -s /Applications/<Xcode>.app"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install root deps
        uses: ./.github/actions/bun-install-retry

      - name: Check generated sources and scenario conservation
        run: |
          set -euo pipefail
          bun run check:contract-swift
          native/scripts/sync-contract.sh --check
          bun run check:strings
          bun run native/scripts/test-conservation.ts --check

      - name: Build and test the shared core on iOS Simulator
        run: |
          set -euo pipefail
          unset SHEPHERD_KEYCHAIN_TESTS TEST_RUNNER_SHEPHERD_KEYCHAIN_TESTS
          UITEST_LOCK="$GITHUB_WORKSPACE/native/scripts/uitest-lock.sh"
          EVIDENCE="$RUNNER_TEMP/core-simulator"
          mkdir -p "$EVIDENCE"
          xcrun simctl list devices available -j > "$EVIDENCE/devices.json"
          CORE_SIMULATOR_UDID="$(python3 native/scripts/select-core-simulator.py "$EVIDENCE/devices.json")"
          cd native
          "$UITEST_LOCK" xcodebuild -scheme ShepherdAppCore -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation build 2>&1 | tail -n 40
          "$UITEST_LOCK" xcodebuild -scheme ShepherdAppCore -destination "platform=iOS Simulator,id=$CORE_SIMULATOR_UDID" -parallel-testing-enabled NO -only-testing:ShepherdAppCoreTests -resultBundlePath "$EVIDENCE/core.xcresult" -skipPackagePluginValidation test 2>&1 | tail -n 40

      - name: Validate executed core identities and parameter arguments
        if: always()
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/core-simulator"
          xcrun xcresulttool get test-results summary --path "$EVIDENCE/core.xcresult" > "$EVIDENCE/summary.json"
          xcrun xcresulttool get test-results tests --path "$EVIDENCE/core.xcresult" > "$EVIDENCE/tests.json"
          python3 native/scripts/check-core-results.py "$EVIDENCE/summary.json" "$EVIDENCE/tests.json" --parameters native/Tests/Conservation/issue-2431-core-parameters.json | tee "$EVIDENCE/result.txt"
          cat "$EVIDENCE/result.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish simulator results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shared-core-simulator
          path: ${{ runner.temp }}/core-simulator
          if-no-files-found: error

  shepherd-mac-ui:
    needs: shepherd-app-core-simulator
    name: Shepherd for Mac (XCUITest)
    runs-on: macos-latest
    # Non-blocking on purpose. XCUITest needs a real GUI login session; on a
    # hosted runner it is flaky in ways that have nothing to do with the diff.
    # A red run here is a signal to look, not a reason to stop a merge. Promote
    # it to blocking only after it has been green for a sustained run of PRs.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The same three steps the `shepherdkit` job runs, and for the same
      # reasons: this job builds the very same app target and ShepherdKit's
      # three Apple OpenAPI dependencies. Without them a runner with an older
      # default Xcode fails deep inside a manifest parse instead of at a clear
      # gate, every run re-resolves and rebuilds the dependencies from scratch,
      # and — because this job is non-blocking — the confusing failure is one
      # nobody has to look at.
      - name: Report the toolchain
        run: |
          swift --version
          native/scripts/uitest-lock.sh xcodebuild -version

      - name: Require Swift 6.2 or newer
        run: |
          set -euo pipefail
          version="$(swift -version 2>&1 | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p')"
          if [ -z "$version" ]; then
            echo "::error::could not parse swift version"
            exit 1
          fi
          echo "detected swift $version"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          if [ "$major" -lt 6 ] || { [ "$major" -eq 6 ] && [ "$minor" -lt 2 ]; }; then
            echo "::error::Swift $version is too old; Shepherd.app needs 6.2+."
            echo "Installed Xcodes:"; ls /Applications | grep -i '^Xcode' || true
            echo "Pin a newer one with: sudo xcode-select -s /Applications/<Xcode>.app"
            exit 1
          fi

      # Same key as the `shepherdkit` job, so whichever runs first warms the
      # other's restore.
      - name: Cache SwiftPM build state
        uses: actions/cache@v6
        with:
          path: |
            native/.build
            native/Apps/ShepherdMac/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('native/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: UI smoke test
        run: |
          set -euo pipefail
          native/scripts/uitest-lock.sh native/scripts/test-app.sh -parallel-testing-enabled NO -only-testing:ShepherdUITests 2>&1 | tail -n 40
