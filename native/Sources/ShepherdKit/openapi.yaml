        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/epics/completed/resolve-conflicts:
    post:
      operationId: resolveCompletedEpicConflicts
      description: Start an agent that rebases the integration branch onto the default branch, resolves the conflicts and updates the landing PR. Refused while a repair session already works it. Error bodies carry the stable `reason` code beside `error`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletedEpicTarget"
      responses:
        "202":
          description: The agent was started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: error is "invalid repo" or "parent must be a positive integer".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "reason is no-landing: there is no open landing PR."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: reason is unsupported, busy, repairing or not-conflicting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: "reason is spawn-failed: the agent could not be started."
          content:
