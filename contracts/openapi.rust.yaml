        "404":
          description: Unknown id, or no forge for this repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The forge failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/git/pr:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: openPullRequest
      description: Opens a PR for the session branch. Answers the bare PR status — no `kind`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenPrBody"
