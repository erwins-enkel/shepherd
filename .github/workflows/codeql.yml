name: CodeQL

# Advanced setup for code scanning + code quality.
#
# We moved off DEFAULT setup because GitHub Code Quality (the preview product that
# surfaces reliability/maintainability findings) is default-setup-only and offers no
# path filtering — its whole config surface is languages + runner. That left 50 of 53
# findings sitting in vendored inlang/Paraglide plugin bundles with no way to exclude
# them (linguist-generated/-vendored markers are ignored by CodeQL; the findings API
# is read-only). Advanced setup runs the same queries via the `security-and-quality`
# suite while honoring `paths-ignore` in .github/codeql/codeql-config.yml.
#
# Default setup must stay off (Settings > Code security > CodeQL analysis, and Settings >
# Code quality): while it is on, GitHub rejects this workflow's SARIF uploads. It also has
# no path filter, so it ran a macOS Swift scan on every PR. Swift lives in
# codeql-swift.yml, filtered to native/.
# Findings appear under Security > Code scanning alerts, not the Code Quality tab.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Docs-only PRs have no code to scan. Safe because CodeQL is not a required check;
    # push-to-main and the weekly scan keep full coverage.
    paths-ignore: ["docs/**", "**/*.md"]
  schedule:
    # Weekly, matching the cadence of the previous default setup.
    - cron: "27 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF results
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Every scanned language but Swift, which needs macOS (codeql-swift.yml).
        language: [javascript-typescript, actions, python, rust]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          # No build required — all of these use build-less extraction.
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
