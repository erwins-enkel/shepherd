        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id, or no forge for this repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: No open PR.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The forge failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/git/close:
    parameters:
      - name: id
        in: path
