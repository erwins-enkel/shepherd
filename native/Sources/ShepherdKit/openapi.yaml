      description: Remove a row from the band. Hides it only — the landing PR, the integration branch and the epic issue stay. Lands as epic:completed-cleared.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletedEpicTarget"
