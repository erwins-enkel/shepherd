      properties:
        slots:
          type: integer
        finishAt:
          type: integer
          description: Epoch ms.
        savedMs:
          type: integer
    EpicForecast:
      type: object
      additionalProperties: true
      description: "When the epic lands and how sure that is (EpicForecast in src/epic-core.ts, computed by src/epic-forecast.ts), epoch milliseconds throughout. While the epic's clock is stopped (paused, idle) nothing is absolute: finishAt, finishLow and finishHigh are null and remainingMsFromResume carries the time from a resume to the landing. confidence says how much it rests on the epic's own measured children: very-low = the repo median alone, low = one own sample, medium = two or three, high = four or more, or half the children merged. No data at all is not a rung — the Epic then carries forecast null."
      required:
        - finishAt
        - finishLow
        - finishHigh
        - remainingMsFromResume
        - confidence
        - stepMs
        - landingMs
        - epicSamples
        - repoSamples
        - firstFinishAt
        - fasterWithSlots
        - children
      properties:
        finishAt:
          type: integer
          nullable: true
          description: When the landing PR is projected to merge; null while the clock is stopped.
        finishLow:
          type: integer
          nullable: true
          description: The early end of the range (p25 step durations).
        finishHigh:
          type: integer
          nullable: true
          description: The late end of the range (p75 step durations).
        remainingMsFromResume:
          type: integer
          nullable: true
          description: While the clock is stopped, ms from a resume to the landing; else null.
        confidence:
          $ref: "#/components/schemas/EpicForecastConfidence"
        stepMs:
          type: integer
          description: The per-child estimate — the epic's measured children blended with the repo's median lead time.
        landingMs:
          type: integer
          description: The landing estimate — the repo's past epic landings, else 20 min.
        epicSamples:
          type: integer
          description: This epic's children with a measured duration.
        repoSamples:
          type: integer
          description: Tasks behind the repo's median lead time (0 when it has none).
        firstFinishAt:
          type: integer
          nullable: true
          description: The first forecast made after the first child merged — the drift anchor.
        fasterWithSlots:
          allOf:
            - $ref: "#/components/schemas/EpicForecastWhatIf"
          description: Set only when one more slot saves at least 15 min and a ready child waits on the cap.
          nullable: true
        children:
          type: array
          items:
            $ref: "#/components/schemas/EpicChildForecast"
          description: Every child not yet merged, in epic order.
