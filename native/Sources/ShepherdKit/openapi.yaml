  /api/usage/codex/reset:
    post:
      operationId: redeemCodexReset
      description: Redeem one earned Codex reset. Retry uncertain requests with the same UUID. Operator ingress only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - requestId
              properties:
                requestId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Current reset result and capacity status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodexResetStatus"
        "202":
          description: Redemption or capacity verification remains pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodexResetStatus"
        "400":
          description: Invalid request UUID or JSON body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Account service unavailable or first-run setup incomplete.
  /api/usage/codex/automation:
    put:
      operationId: setCodexResetAutomation
      description: Persist the operator's opt-in for proactive and useful pre-expiry redemption. Operator ingress only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: Updated reset automation status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodexResetStatus"
        "400":
          description: Invalid enabled value or JSON body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Account service unavailable or first-run setup incomplete.
  /api/usage/limits:
    get:
      operationId: getUsageLimits
      responses:
