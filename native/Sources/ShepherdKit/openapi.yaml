        - error
      properties:
        number:
          type: integer
        error:
          type: string
    UpNextStartResult:
      type: object
      additionalProperties: true
      required:
        - created
        - held
        - errors
      properties:
        created:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        held:
          type: array
          items:
            $ref: "#/components/schemas/UpNextStartHeld"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/UpNextStartError"
    HaltResult:
      type: object
      additionalProperties: true
      required:
        - halted
      properties:
        halted:
          type: integer
    RetryRequest:
      type: object
      additionalProperties: false
      required:
        - text
        - ids
      properties:
        text:
          type: string
          minLength: 1
        ids:
          type: array
          items:
            type: string
    RetryResult:
      type: object
      additionalProperties: true
      required:
        - resumed
        - steered
        - total
      properties:
        resumed:
          type: integer
        steered:
          type: integer
        total:
          type: integer
    ReviveResult:
      type: object
      additionalProperties: true
      required:
        - revived
        - failed
      properties:
        revived:
          type: integer
        failed:
          type: integer
    UsageSource:
      anyOf:
        - $ref: "#/components/schemas/UsageSourceKnown"
        - type: string
    UsageSourceKnown:
      type: string
      enum:
        - live
        - snapshot
        - codex
        - none
    SessionUsage:
      type: object
      additionalProperties: true
      required:
        - available
        - source
        - total
        - input
        - output
        - cacheRead
        - cacheWrite
        - messageCount
        - byModel
      properties:
        available:
          type: boolean
        source:
          $ref: "#/components/schemas/UsageSource"
        total:
          type: integer
        input:
          type:
            - integer
            - "null"
        output:
          type:
            - integer
            - "null"
        cacheRead:
          type:
            - integer
            - "null"
        cacheWrite:
          type:
            - integer
            - "null"
        messageCount:
          type:
            - integer
            - "null"
        byModel:
          type:
            - object
            - "null"
          additionalProperties:
            type: integer
      description: 'available: false means "no resolvable data source", while a real zero is available: true, total: 0. Splits, messageCount and byModel are null when the source does not carry them. byModel is raw tokens per model, never weighted units.'
    BroadcastRequest:
      type: object
      additionalProperties: false
      required:
        - text
        - ids
      properties:
        text:
          type: string
          minLength: 1
        ids:
          type: array
          items:
            type: string
    BroadcastResult:
      type: object
      additionalProperties: true
      required:
        - delivered
        - queued
        - offline
        - skipped
        - total
      properties:
        delivered:
          type: integer
        queued:
          type: integer
        offline:
          type: integer
        skipped:
          type: integer
        total:
          type: integer
    UpNextSnapshotEvent:
      type: object
      additionalProperties: true
      required:
        - snapshot
      properties:
        snapshot:
          $ref: "#/components/schemas/UpNextSnapshot"
    HaltDoneEvent:
      $ref: "#/components/schemas/HaltResult"
    SessionHaltEvent:
      type: object
      additionalProperties: true
      required:
        - id
        - haltedAt
      properties:
        id:
          type: string
        haltReason:
          anyOf:
            - type: string
              enum:
                - usage_limit
                - completed
                - operator
                - error
            - type: string
        haltedAt:
          type:
            - integer
            - "null"
    SessionHoldEvent:
      type: object
      additionalProperties: true
      required:
        - id
      properties:
        id:
          type: string
        hold:
          $ref: "#/components/schemas/HoldReason"
    SessionsStrandedEvent:
      type: object
      additionalProperties: true
      required:
        - count
      properties:
        count:
          type: integer
    AutoRevivedEvent:
      $ref: "#/components/schemas/ReviveResult"
    RestoreConflictReason:
      anyOf:
        - $ref: "#/components/schemas/RestoreConflictReasonKnown"
        - type: string
    RestoreConflictReasonKnown:
      type: string
      enum:
        - in_progress
        - not_archived
        - cannot_restore
        - branch_gone
        - branch_in_use
        - spawn_refused
    RestoreConflict:
      type: object
      additionalProperties: true
      required:
        - error
        - code
      properties:
        error:
          type: string
        code:
          $ref: "#/components/schemas/RestoreConflictReason"
    UploadResponse:
      type: object
      additionalProperties: true
      required:
        - path
      properties:
        path:
          type: string
          description: Absolute path of the staged attachment.
    Issue:
      type: object
      additionalProperties: true
      description: An open forge issue, as GET /api/issues lists them. Copied from Issue in src/types.ts:288.
      required:
        - number
        - title
        - body
        - url
        - labels
        - createdAt
        - assignees
      properties:
        number:
          type: integer
        title:
          type: string
        body:
          type: string
          description: May be truncated by the server.
        url:
          type: string
        labels:
          type: array
          items:
            type: string
        labelColors:
          type: object
          additionalProperties:
            type: string
          description: Label name to the forge's own "#rrggbb". Absent for forges that do not report colours.
        createdAt:
          type: integer
        assignees:
          type: array
          items:
            type: string
        author:
          type: string
        blockedBy:
          type: array
          items:
            type: integer
          description: Still-open issues blocking this one. Attached best-effort — the route fails OPEN, so absent does not mean unblocked.
    IssueFetchTransport:
      anyOf:
        - $ref: "#/components/schemas/IssueFetchTransportKnown"
        - type: string
    IssueFetchTransportKnown:
      type: string
      enum:
        - cli
        - rest
    IssueFetchAttempt:
      type: object
      additionalProperties: true
      description: One failed transport attempt, for the "why did issues not load" detail. Copied from src/types.ts:315.
      required:
        - transport
        - reason
        - detail
      properties:
        transport:
          $ref: "#/components/schemas/IssueFetchTransport"
        reason:
          anyOf:
            - type: string
              enum:
                - rate_limit
                - auth
                - not_found
                - gh_missing
                - network
                - http
                - unknown
            - type: string
        status:
          type: integer
        detail:
          type: string
    IssueListing:
      type: object
      additionalProperties: true
      description: 'GET /api/issues?repo=. ALWAYS 200 when the repo resolves — a forge that threw answers this same shape with `error: "fetch_failed"` and an empty list, never a 5xx. `slug: null` with an empty list is the honest "this repo has no forge" answer, which is a different message for the operator than a failed fetch.'
      required:
        - slug
        - webUrl
        - issues
        - viewer
      properties:
        slug:
          type:
            - string
            - "null"
          description: owner/repo, or null when there is no forge.
        webUrl:
          type:
            - string
            - "null"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        viewer:
          type:
            - string
            - "null"
          description: The authenticated forge user. The "mine & unassigned" filter fails OPEN when this is null — a client that hid everything instead would show an empty list for a repo whose issues are all assigned.
        error:
          type:
            - string
            - "null"
          description: '"fetch_failed" when the listing threw. The list is then empty and stale.'
        lightweight:
          type: boolean
          description: Repo is in local-only mode — no forge by configuration. Not a failure; test with === true.
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/IssueFetchAttempt"
          description: Present only when the error carried a gh trail.
    SlashCommandScope:
      anyOf:
        - $ref: "#/components/schemas/SlashCommandScopeKnown"
        - type: string
    SlashCommandScopeKnown:
      type: string
      enum:
        - project
        - user
        - plugin
        - builtin
    SlashCommandKind:
      anyOf:
        - $ref: "#/components/schemas/SlashCommandKindKnown"
        - type: string
    SlashCommandKindKnown:
      type: string
      enum:
        - skill
        - command
        - plugin
    SlashCommand:
      type: object
      additionalProperties: true
      description: One installed slash command or skill (src/commands.ts:16). `invocations` is how a command is typed per engine; an empty map is non-insertable. Only when the map is absent, fall back to "/name" for claude and "$name" for codex.
      required:
        - name
        - description
        - scope
      properties:
        id:
          type: string
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
          description: Uncapped.
        scope:
          $ref: "#/components/schemas/SlashCommandScope"
        kind:
          $ref: "#/components/schemas/SlashCommandKind"
        invocationName:
          type: string
        sourceNamespace:
          type: string
        sourcePath:
          type: string
        providers:
          type: array
          items:
            $ref: "#/components/schemas/AgentProvider"
          description: "Exactly one entry means this command constrains the engine: the composer switches to it and disables the others while the token is in the prompt."
        invocations:
          type: object
          additionalProperties:
            type: string
          description: Agent provider to the literal token to insert.
        argumentHint:
          type: string
    CommandListing:
      type: object
      additionalProperties: true
      required:
        - commands
      properties:
        commands:
          type: array
          items:
            $ref: "#/components/schemas/SlashCommand"
    EpicSummary:
      type: object
      additionalProperties: true
      description: Enough of an epic to tag an issue row and to build the sub-issue filter's parent set. The epic PANEL is out of scope for milestone 3.
      required:
        - parentIssueNumber
        - parentTitle
      properties:
        parentIssueNumber:
          type: integer
        parentTitle:
          type: string
    EpicListing:
      type: object
      additionalProperties: true
      description: "GET /api/epics?repo=. Answers {epics: [], subIssues: []} whenever the drain dep or the forge is absent — an empty answer is never an error."
      required:
        - epics
        - subIssues
      properties:
        epics:
          type: array
          items:
            $ref: "#/components/schemas/EpicSummary"
        subIssues:
          type: array
          items:
            type: integer
          description: Issue numbers that are children of an epic. The "hide sub-issues" filter removes these.
    BranchListing:
      type: object
      additionalProperties: true
      required:
        - branches
        - current
        - default
      properties:
        branches:
          type: array
          items:
            type: string
        current:
          type:
            - string
            - "null"
        default:
          type:
            - string
            - "null"
          description: Repo default from origin/HEAD; may not be a local branch.
    BranchStatus:
      type: object
      additionalProperties: true
      required:
        - behind
        - ahead
        - diverged
        - hasUpstream
        - localExists
      properties:
        behind:
          type: integer
        ahead:
          type: integer
        diverged:
          type: boolean
        hasUpstream:
          type: boolean
        localExists:
          type: boolean
    InitEmptyCommitRequest:
      type: object
      additionalProperties: false
      required:
        - repo
      properties:
        repo:
          type: string
        branch:
          type: string
          description: Trimmed; defaults to main when absent or blank.
    InitEmptyCommitResponse:
      type: object
      additionalProperties: true
      required:
        - branch
      properties:
        branch:
          type: string
    TaskBriefDraft:
      type: object
      additionalProperties: true
      required:
        - problem
        - outcome
        - constraints
        - nonGoals
      properties:
        problem:
          type: string
        outcome:
          type: string
        constraints:
          type: array
          items:
            type: string
        nonGoals:
          type: array
          items:
            type: string
    ShapeRequest:
      type: object
      additionalProperties: false
      required:
        - repoPath
        - prompt
        - provider
      properties:
        repoPath:
          type: string
        prompt:
          type: string
        provider:
          $ref: "#/components/schemas/AgentProvider"
        model:
          type:
            - string
            - "null"
          minLength: 1
    ShapeRound:
      type: object
      additionalProperties: true
      required:
        - draft
        - block
      properties:
        draft:
          $ref: "#/components/schemas/TaskBriefDraft"
        block:
          $ref: "#/components/schemas/VisualBlockQuestionForm"
    ShapeBriefRequest:
      type: object
      additionalProperties: false
      required:
        - draft
        - block
        - answers
      properties:
        draft:
          $ref: "#/components/schemas/TaskBriefDraft"
        block:
          $ref: "#/components/schemas/VisualBlockQuestionForm"
        answers:
          type: array
          items:
            $ref: "#/components/schemas/RawAnswer"
    ShapeBriefResponse:
      type: object
      additionalProperties: true
      required:
        - brief
      properties:
        brief:
          type: string
    ShapeFailure:
      type: object
      additionalProperties: true
      required:
        - error
      properties:
        error:
          anyOf:
            - type: string
              enum:
                - empty-prompt
                - spawn-failed
                - timeout
                - unavailable
            - type: string
    ShapeUnavailable:
      type: object
      additionalProperties: true
      required:
        - error
      properties:
        error:
          anyOf:
            - type: string
              enum:
                - unavailable
            - type: string
    SpawnPhase:
      type: string
      enum:
        - base
        - worktree
        - prompt
        - launch
        - agent
    SpawnProgressEvent:
      type: object
      additionalProperties: true
      required:
        - spawnId
        - phase
        - startedAt
        - completed
      properties:
        spawnId:
          type: string
        phase:
          $ref: "#/components/schemas/SpawnPhase"
        startedAt:
          type: integer
        completed:
          type: array
          items:
            type: object
            additionalProperties: true
            required:
              - phase
              - ms
            properties:
              phase:
                $ref: "#/components/schemas/SpawnPhase"
              ms:
                type: number
    SpawnCancelResponse:
      type: object
      additionalProperties: true
      required:
        - canceled
      properties:
        canceled:
          type: boolean
  responses:
    Unauthorized:
      description: Missing or invalid credential.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
paths:
  /api/health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Server is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/login:
    post:
      operationId: login
      security: []
      description: Password login. Sets the shepherd_session cookie. The native client uses it once to mint an access token, then discards the cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in; Set-Cookie carries the session.
          headers:
            Set-Cookie:
              required: true
              description: "shepherd_session cookie (login: signed session; logout: cleared with Max-Age=0)."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          description: Wrong password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/logout:
    post:
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Session cookie cleared.
          headers:
            Set-Cookie:
              required: true
              description: "shepherd_session cookie (login: signed session; logout: cleared with Max-Age=0)."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/access-tokens:
    get:
      operationId: listAccessTokens
      security:
        - cookieAuth: []
      responses:
        "200":
          description: All tokens (no plaintext).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not an operator session (a bearer token cannot manage tokens).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: mintAccessToken
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessTokenMintRequest"
      responses:
        "201":
          description: Token minted; plaintext shown exactly once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenMinted"
        "400":
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not an operator session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/access-tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: revokeAccessToken
      description: Revokes one token. An operator session may revoke any token; a bearer access token may revoke ITSELF and nothing else, which is how a native client invalidates its own credential on logout. Self-revocation is allowed whatever the token's scope.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Only an operator session may revoke other tokens; a bearer token may revoke itself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown token id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: Operator settings incl. first-run state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: putRepoRoot
      description: Only the repoRoot form is part of this contract; it also resolves the first-run picker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoRootRequest"
      responses:
        "200":
          description: Repo root stored; first run resolved if it was pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoRootResponse"
        "400":
          description: Not an existing directory under the root ceiling.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sessions:
    get:
      operationId: listSessions
      description: Active (non-archived) sessions, oldest first. No pagination.
      responses:
        "200":
          description: Sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSession
      description: Creates and spawns a session, or answers 200 with a held task when the usage hold trips (force overrides the hold).
      parameters:
        - name: X-Shepherd-Spawn-Id
          in: header
          required: false
          description: Client-chosen correlation id for this create. With a valid one the caller receives live `spawn:progress` frames and may cancel through POST /api/spawns/{id}/cancel; without one the spawn still runs and is still measured. Deliberately a header and not a body field (src/server.ts:2400-2404) — a usage hold persists the BODY, so a spawn id there would be replayed stale when the held task is finally spawned. Header names are case-insensitive; the server compares lowercase.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "200":
          description: Usage hold tripped — queued as a held task instead of spawned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeldTask"
        "201":
          description: Session created and agent spawned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid input (see error text).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: First run pending, name taken, worktree occupied, or herdr restart required (see code).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The base branch does not resolve to a ref in the repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Create failed downstream (git or the agent runner).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/done:
    get:
      operationId: listDoneSessions
      description: Recently archived sessions for the Done lens.
      responses:
        "200":
          description: Sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getSession
      responses:
        "200":
          description: Session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: archiveSession
      description: Archives the session (stops the agent, keeps the row). Always 200.
      responses:
        "200":
          description: Archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sessions/{id}/interrupt:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: interruptSession
      responses:
        "200":
          description: Interrupt delivered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/repos:
    get:
      operationId: listRepos
      responses:
        "200":
          description: Repos under the workspace root.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sessions/{id}/reply:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: replySession
      description: Steer a running session with operator free text. The text is delivered to the session's live agent pane. An unknown id, an unreachable herdr, or a dead pane is 404 — a normal outcome for a caller whose session list is a tick stale.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyRequest"
      responses:
        "200":
          description: The text was delivered to the agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: "The body was not {text: string}."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
